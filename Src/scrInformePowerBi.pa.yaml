Screens:
  scrInformePowerBi:
    Properties:
      Fill: =Colores.Blanco
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - cntPantallaInformePowerBi:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpMenuLateralInformePowerBi:
                Control: CanvasComponent
                ComponentName: cmpMenuLateral
                Properties:
                  Visible: =App.ActiveScreen.Size > ScreenSize.Small || VarMenu
                  Height: =Parent.Height
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Width: =If(App.ActiveScreen.Size = ScreenSize.Small, If(VarMenu, Parent.Width, 0), If(VarMenu, 200, 70))
            - cntPrincipalInformePowerBi:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Visible: =!(App.ActiveScreen.Size = ScreenSize.Small && VarMenu)
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpEncabezadoInformePowerBi:
                      Control: CanvasComponent
                      ComponentName: cmpEncabezado
                      Properties:
                        Height: =60
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =Max(Parent.Width, 300)
                  - cntContenidoInformePowerBi:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - pbiInformeAdmin:
                            Control: PowerBI@2.4.0
                            Properties:
                              AlignInContainer: =AlignInContainer.End
                              BorderColor: =Colores.FondoSuave
                              BorderStyle: =BorderStyle.None
                              Height: =Parent.Height
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinWidth: =0
                              TileUrl: =""
                              Width: =Parent.Width
                              WorkspaceId: ="__my-workspace"
