Screens:
  scrMisHitos:
    Properties:
      Fill: =Colores.Blanco
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Reset(cmbEncargadoMisHitos);
        Reset(cmbProyectoMisHitos);
        Reset(cmbClienteMisHitos);
        Reset(cmbEstadoMisHitos);
        Reset(cmbSegmentoMisHitos);
    Children:
      - cntPantallaMisHitos:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpMenuLateralMisHitos:
                Control: CanvasComponent
                ComponentName: cmpMenuLateral
                Properties:
                  Visible: =App.ActiveScreenSize > ScreenSize.Small || VarMenu
                  Height: =Parent.Height
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Width: =If(App.ActiveScreenSize = ScreenSize.Small, If(VarMenu, Parent.Width, 0), If(VarMenu, 200, 70))
            - cntPrincipalMisHitos:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  Visible: =!(App.ActiveScreenSize = ScreenSize.Small && VarMenu)
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpEncabezadoMisHitos:
                      Control: CanvasComponent
                      ComponentName: cmpEncabezado
                      Properties:
                        Height: =60
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =Max(Parent.Width, 300)
                  - cntBarraHerramientasMisHitos:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(App.ActiveScreenSize <= ScreenSize.Medium, 110, Max(60, Parent.Height * 0.08))
                        LayoutDirection: =If(App.ActiveScreenSize <= ScreenSize.Medium, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblTituloMisHitos:
                            Control: Label@2.5.1
                            Properties:
                              Height: =If(App.ActiveScreenSize <= ScreenSize.Medium, 45, Parent.Height)
                              Align: =If(App.ActiveScreenSize <= ScreenSize.Medium, Align.Left, Align.Center)
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =If(IsBlank(varFiltroRapidoH) && IsBlank(varEncFoco), RGBA(50, 49, 48, 1), MyTheme.Primary)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Lato Black'
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =// Clic en el título con filtros rápidos activos: los quita
                                Set(varFiltroRapidoH, Blank());
                                Set(varEncFoco, Blank());
                                Set(varEncFocoNombre, Blank())
                              PaddingLeft: =Espacio.L
                              Size: =If(IsBlank(varFiltroRapidoH) && IsBlank(varEncFoco), 14, 12)
                              Text: |-
                                ="Hitos" &
                                If(
                                    IsBlank(varFiltroRapidoH) && IsBlank(varEncFoco),
                                    "",
                                    "  ·  " & Concat(Filter(Table({ t: varFiltroRapidoH }, { t: varEncFocoNombre }), !IsBlank(t)), t, " + ") & "  ✕"
                                )
                              Tooltip: =If(IsBlank(varFiltroRapidoH) && IsBlank(varEncFoco), "", "Clic para quitar los filtros rápidos")
                              Width: =If(IsBlank(varFiltroRapidoH) && IsBlank(varEncFoco), 250, 380)
                        - cntFiltrosMisHitos:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              BorderColor: =Blank()
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Fill: =Colores.Blanco
                              Height: =60
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =Espacio.XS
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =54
                              LayoutMinWidth: =0
                              PaddingRight: =Espacio.L
                              PaddingTop: =Espacio.XS
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.ActiveScreenSize <= ScreenSize.Medium, Parent.Width, Parent.Width - lblTituloMisHitos.Width)
                            Children:
                              - txtBuscarMisHitos:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    BorderRadius: =4
                                    Font: =Font.Lato
                                    FontColor: =MyTheme.Gray
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Placeholder: ="Buscar"
                                    TriggerOutput: ='TextInputCanvas.TriggerOutput'.Delayed
                                    Width: =If(App.ActiveScreenSize = ScreenSize.Small, Parent.Width * 0.65, If(App.ActiveScreenSize = ScreenSize.Medium, Parent.Width * 0.3, Parent.Width / 5)) - Parent.LayoutGap
                              - btnBuscarMisHitos:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Quitar filtros"
                                    Align: =Align.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BorderThickness: =0
                                    FontColor: =RGBA(15, 108, 189, 1)
                                    FontSize: =30
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height - Parent.PaddingTop - Parent.PaddingBottom
                                    Icon: ="Search"
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Self.Height
                              - cmbEncargadoMisHitos:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    Font: =Font.Lato
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    InputTextPlaceholder: ="Encargado"
                                    Items: =Distinct( UsuariosDemo,ThisRecord.DisplayName)
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =30
                                    PaddingBottom: =Espacio.M
                                    PaddingTop: =Espacio.M
                                    Visible: =false
                                    Width: =Parent.Width * 0.15 - Parent.LayoutGap
                                  Children:
                                    - fldEncargadoMisHitos:
                                        Control: ComboBoxDataField@1.5.0
                                        Variant: textualColumn
                                        Properties:
                                          FieldName: ="Value"
                                          FieldType: ="s"
                                          Order: =1
                              - cmbProyectoMisHitos:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    Visible: =App.ActiveScreenSize > ScreenSize.Small
                                    Font: =Font.Lato
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    InputTextPlaceholder: ="Proyecto"
                                    Items: =Distinct(ColProyectos, 'Nombre del proyecto')
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =30
                                    PaddingBottom: =Espacio.M
                                    PaddingTop: =Espacio.M
                                    SelectMultiple: =true
                                    Width: =If(App.ActiveScreenSize = ScreenSize.Medium, Parent.Width * 0.22, Parent.Width * 0.15) - Parent.LayoutGap
                                  Children:
                                    - fldProyectoMisHitos:
                                        Control: ComboBoxDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="Value"
                                          FieldName: ="Value"
                                          FieldType: ="s"
                                          Order: =1
                              - cmbClienteMisHitos:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    Visible: =App.ActiveScreenSize >= ScreenSize.Large
                                    Font: =Font.Lato
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    InputTextPlaceholder: ="Cliente"
                                    Items: =Distinct(ColProyectos, 'Nombre del Cliente')
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =30
                                    PaddingBottom: =Espacio.M
                                    PaddingTop: =Espacio.M
                                    SelectMultiple: =true
                                    Width: =Parent.Width * 0.15 - Parent.LayoutGap
                              - cmbEstadoMisHitos:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    Visible: =App.ActiveScreenSize > ScreenSize.Small
                                    Font: =Font.Lato
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    InputTextPlaceholder: ="Estado"
                                    Items: =Distinct(ColHitos.Estado, ThisRecord.Estado.Value)
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Width: =If(App.ActiveScreenSize = ScreenSize.Medium, Parent.Width * 0.22, Parent.Width * 0.15) - Parent.LayoutGap
                                  Children:
                                    - fldEstadoMisHitos:
                                        Control: ComboBoxDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="Value"
                                          FieldName: ="Value"
                                          FieldType: ="s"
                                          Order: =1
                              - cmbSegmentoMisHitos:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    Font: =Font.Lato
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    InputTextPlaceholder: ="Segmento"
                                    Items: =Distinct(ColProyectos.Segmento, ThisRecord.Segmento.Value)
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    SelectMultiple: =true
                                    Visible: =varAccesoTotal && App.ActiveScreenSize >= ScreenSize.Large
                                    Width: =Parent.Width * 0.15 - Parent.LayoutGap
                                  Children:
                                    - fldSegmentoMisHitos:
                                        Control: ComboBoxDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="Value"
                                          FieldName: ="Value"
                                          FieldType: ="s"
                                          Order: =1
                              - btnQuitarFiltrosMisHitos:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Quitar filtros"
                                    Align: =Align.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BorderThickness: =0
                                    FontColor: =RGBA(189, 49, 51, 1)
                                    FontSize: =30
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height - Parent.PaddingTop - Parent.PaddingBottom
                                    Icon: ="Eraser"
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |-
                                      =Reset(txtBuscarMisHitos);
                                      Reset(cmbProyectoMisHitos);
                                      Reset(cmbEstadoMisHitos);
                                      Reset(cmbEncargadoMisHitos);
                                      Reset(cmbClienteMisHitos);
                                      Reset(cmbSegmentoMisHitos);
                                      // Filtros rápidos (chips, encargado y columna ampliada)
                                      Set(varFiltroRapidoH, Blank());
                                      Set(varEncFoco, Blank());
                                      Set(varEncFocoNombre, Blank());
                                      Set(varEstadoFocoH, Blank());
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Self.Height
                  - galVistasMisHitos:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        BorderColor: =Colores.FondoSuave
                        BorderStyle: =BorderStyle.None
                        FillPortions: =0
                        Height: =40
                        Items: |-
                          =// 1-2: pestañas de vista. 3-5: filtros rápidos (un clic filtra, otro clic lo quita)
                          [
                              {ID:1, title:"Tablero"},
                              {ID:2, title:"Lista"},
                              {ID:3, title:"Vencidos"},
                              {ID:4, title:"Vence ≤ 7 d"},
                              {ID:5, title:"Asignados a mí"}
                          ]
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =0
                        TemplatePadding: =0
                        TemplateSize: =120
                      Children:
                        - btnVistaMisHitos:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: |-
                                =If(
                                    ThisItem.ID <= 2, If(varVista = ThisItem.title, MyTheme.Primary, MyTheme.Gray),
                                    varFiltroRapidoH = ThisItem.title, Color.White,
                                    MyTheme.Gray
                                )
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: =If(ThisItem.ID > 2 && varFiltroRapidoH = ThisItem.title, MyTheme.Primary, If(ThisItem.ID > 2, MyTheme.LightGray, RGBA(0, 0, 0, 0)))
                              Font: =Font.'Lato Black'
                              Height: =If(ThisItem.ID > 2, Parent.TemplateHeight - 8, Parent.TemplateHeight)
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =If(ThisItem.ID > 2 && varFiltroRapidoH = ThisItem.title, Color.White, MyTheme.Primary)
                              HoverFill: =If(ThisItem.ID > 2, ColorFade(Self.Fill, -8%), Color.Transparent)
                              OnSelect: |-
                                =If(
                                    ThisItem.ID <= 2,
                                    Set(varVista, ThisItem.title),
                                    Set(varFiltroRapidoH, If(varFiltroRapidoH = ThisItem.title, Blank(), ThisItem.title))
                                )
                              PressedBorderColor: =Color.Transparent
                              PressedColor: =ColorFade(Self.HoverColor, -20%)
                              PressedFill: =Color.Transparent
                              RadiusBottomLeft: =If(ThisItem.ID > 2, 16, 0)
                              RadiusBottomRight: =If(ThisItem.ID > 2, 16, 0)
                              RadiusTopLeft: =If(ThisItem.ID > 2, 16, 0)
                              RadiusTopRight: =If(ThisItem.ID > 2, 16, 0)
                              Size: =If(ThisItem.ID > 2, 11, 14)
                              Text: =ThisItem.title
                              Tooltip: =If(ThisItem.ID > 2, "Clic para filtrar; otro clic quita el filtro", "")
                              Width: =If(ThisItem.ID > 2, Parent.TemplateWidth - 8, Parent.TemplateWidth)
                              Y: =If(ThisItem.ID > 2, 4, 0)
                  - galTableroHitos:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        BorderColor: =Colores.FondoSuave
                        DelayItemLoading: =false
                        Fill: =MyTheme.LightGray
                        Items: |-
                          =// Clic en el título de una columna: se muestra solo esa columna, a todo el ancho y en cuadrícula
                          If(IsBlank(varEstadoFocoH), EstadosHito, Filter(EstadosHito, Value = varEstadoFocoH))
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =If(IsBlank(varEstadoFocoH), If(App.ActiveScreenSize = ScreenSize.Small, Self.Width * 0.85, 290), Max(290, Self.Width))
                        Visible: =varVista= "Tablero"
                        Width: =Parent.Width
                      Children:
                        - lblColumnaTableroHitos:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =If(IsBlank(varEstadoFocoH), RGBA(50, 49, 48, 1), MyTheme.Primary)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Lato Black'
                              HoverColor: =MyTheme.Primary
                              OnSelect: =Set(varEstadoFocoH, If(IsBlank(varEstadoFocoH), ThisItem.Value, Blank()))
                              Size: =Fuente.Media
                              Text: =ThisItem.Value & "  (" & galTarjetasHitos.AllItemsCount & ")" & If(IsBlank(varEstadoFocoH), "", "   ‹ volver")
                              Tooltip: =If(IsBlank(varEstadoFocoH), "Clic para ampliar esta columna", "Clic para volver a ver todas las columnas")
                              Width: =Parent.TemplateWidth-Self.X
                              X: =50
                              Y: =15
                        - btnColorColumnaHitos:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =Colores.Blanco
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: =DisplayMode.View
                              Fill: |-
                                =Switch(
                                    ThisItem.Value,
                                    "Pendiente", MyTheme.LightBlue, 
                                    "Completado",MyTheme.Green,
                                    "En progreso",MyTheme.DarkBlue,
                                    "Cancelado", MyTheme.Orange,
                                    Color.Transparent
                                )
                              Font: =Font.'Segoe UI'
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(16, 110, 190, 1)
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              Text: =
                              Width: =20
                              X: =15
                              Y: =15
                        - galTarjetasHitos:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =Colores.FondoSuave
                              DelayItemLoading: =false
                              Height: =Parent.Height-Self.Y
                              Items: |-
                                =// Los filtros de proyecto se resuelven sobre ColProyectos (pocas filas) y los hitos se recorren UNA vez por ID de proyecto
                                // (antes se buscaba el proyecto de cada hito: hitos × proyectos operaciones en cada filtro o tecla)
                                With(
                                    {
                                        q: Trim(Lower(txtBuscarMisHitos.Value)),
                                        _est: ForAll(cmbEstadoMisHitos.SelectedItems, Value),
                                        _pro: ForAll(cmbProyectoMisHitos.SelectedItems, Lower(Value)),
                                        _seg: ForAll(cmbSegmentoMisHitos.SelectedItems, Value),
                                        _cli: ForAll(cmbClienteMisHitos.SelectedItems, Lower(Value)),
                                        _esPM: UserRole.Value = "PM"
                                    },
                                    With(
                                        {
                                            _porProy: !IsEmpty(_pro) || !IsEmpty(_seg) || !IsEmpty(_cli),
                                            // Proyectos que cumplen los filtros de proyecto / segmento / cliente
                                            _idsProy: Filter(
                                                ColProyectos,
                                                IsEmpty(_pro) || Lower('Nombre del proyecto') in _pro,
                                                IsEmpty(_seg) || Segmento.Value in _seg,
                                                IsEmpty(_cli) || Lower('Nombre del Cliente') in _cli
                                            ).ID,
                                            // Proyectos cuyo caso CRM o cliente contienen el texto buscado
                                            _idsTxt: Filter(ColProyectos, !IsBlank(q) && (q in Text(NumeroCaso) || q in Lower('Nombre del Cliente'))).ID
                                        },
                                        Filter(
                                            ColHitos,
                                            Estado.Value = ThisItem.Value,
                                            // PM: en "Mis Hitos" solo ve los hitos que tiene asignados (ColHitos incluye todos los de sus proyectos para el avance)
                                            !_esPM || Encargado.Email = dummie.Mail,
                                            IsEmpty(_est) || Estado.Value in _est,
                                            !_porProy || 'ID proyecto' in _idsProy,
                                            IsBlank(q) || q in Lower('Nombre del hito') || 'ID proyecto' in _idsTxt,
                                            // FILTRO-RAPIDO-HITOS (copia idéntica en galTablaHitos): chips y encargado
                                            IsBlank(varFiltroRapidoH) || Switch(
                                                varFiltroRapidoH,
                                                "Vencidos", !(Estado.Value in ["Completado", "Cancelado"]) && !IsBlank(Fecha_Fin) && Fecha_Fin < Today(),
                                                "Vence ≤ 7 d", !(Estado.Value in ["Completado", "Cancelado"]) && !IsBlank(Fecha_Fin) && Fecha_Fin >= Today() && Fecha_Fin <= DateAdd(Today(), 7, TimeUnit.Days),
                                                "Asignados a mí", Encargado.Email = dummie.Mail,
                                                true
                                            ),
                                            IsBlank(varEncFoco) || Lower(Encargado.Email) = varEncFoco
                                        )
                                    )
                                )
                              ShowScrollbar: =false
                              TemplatePadding: =15
                              TemplateSize: =160
                              Width: =Parent.TemplateWidth
                              WrapCount: =If(IsBlank(varEstadoFocoH), 1, Max(1, RoundDown(Self.Width / 290, 0)))
                              Y: =80
                            Children:
                              - cntTarjetaHito:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Fill: =Colores.Blanco
                                    Height: =Parent.TemplateHeight
                                    LayoutDirection: =LayoutDirection.Vertical
                                    PaddingBottom: =Espacio.M
                                    PaddingLeft: =Espacio.L
                                    PaddingRight: =Espacio.L
                                    PaddingTop: =Espacio.M
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - cntCabeceraTarjetaHito:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinHeight: =35
                                          LayoutMinWidth: =0
                                          PaddingTop: =Espacio.M
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Width: =Parent.Width
                                        Children:
                                          - lblNombreTarjetaHito:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =2
                                                Color: =Colores.Texto
                                                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                DisabledColor: =RGBA(161, 159, 157, 1)
                                                FillPortions: =1
                                                FocusedBorderThickness: =4
                                                Font: =Font.'Lato Black'
                                                Height: =30
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Set(varHito, LookUp(ColHitos, ID = ThisItem.ID)); Navigate(scrFormularioHito, ScreenTransition.Fade)
                                                Size: =Fuente.Normal
                                                Text: =ThisItem.'Nombre del hito'
                                                Wrap: =false
                                          - btnAvanceTarjetaHito:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderStyle: =BorderStyle.None
                                                Color: =Colores.Blanco
                                                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                DisabledColor: =RGBA(161, 159, 157, 1)
                                                DisabledFill: =RGBA(242, 242, 241, 0)
                                                Fill: |-
                                                  =// Avance del hito: verde completado, gris cancelado, rojo vencido, ámbar vence en ≤ 7 días, azul en curso
                                                  If(
                                                      ThisItem.Estado.Value = "Completado", ColorValue("#16A34A"),
                                                      ThisItem.Estado.Value = "Cancelado", MyTheme.Gray,
                                                      !IsBlank(ThisItem.Fecha_Fin) && ThisItem.Fecha_Fin < Today(), ColorValue("#DC2626"),
                                                      !IsBlank(ThisItem.Fecha_Fin) && DateDiff(Today(), ThisItem.Fecha_Fin, TimeUnit.Days) <= 7, ColorValue("#D97706"),
                                                      MyTheme.Primary
                                                  )
