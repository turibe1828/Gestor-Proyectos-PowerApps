                                                FocusedBorderThickness: =4
                                                Font: =Font.Lato
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =(Parent.Width/6)-chkHitoCompletado.Width
                                                PaddingLeft: =Espacio.M
                                                Size: =Fuente.Normal
                                                Text: =Text(ThisItem.Fecha_Fin, "yyyy-mm-dd")
                                          - lblCeldaEstadoHito:
