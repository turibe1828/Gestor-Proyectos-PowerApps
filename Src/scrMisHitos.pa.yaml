                                                DisabledColor: =RGBA(161, 159, 157, 1)
                                                Fill: =Colores.Blanco
                                                FillPortions: =1
                                                FocusedBorderThickness: =4
                                                Font: =Font.Lato
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =(Parent.Width/6)-chkHitoCompletado.Width
                                                PaddingLeft: =Espacio.M
