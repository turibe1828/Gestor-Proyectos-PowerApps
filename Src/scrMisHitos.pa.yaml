                                          RadiusTopRight: =0
                                          Width: =Parent.Width
                                        Children:
                                          - chkHitoCompletado:
                                              Control: Classic/CheckBox@2.1.0
                                              Properties:
                                                BorderColor: =MyTheme.LightGray
                                                BorderThickness: =4
                                                CheckboxBackgroundFill: =Color.Transparent
                                                CheckboxBorderColor: =Color.Transparent
                                                CheckmarkFill: =RGBA(0, 120, 212, 1)
                                                Color: =Colores.Texto
                                                Default: =ThisItem.Estado.Value="Completado"
                                                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                DisabledColor: =RGBA(161, 159, 157, 1)
                                                Fill: =Colores.Blanco
                                                FocusedBorderThickness: =4
                                                Font: =Font.'Segoe UI'
                                                HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                HoverColor: =RGBA(50, 49, 48, 1)
                                                HoverFill: =RGBA(0, 0, 0, 0)
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                LayoutMinHeight: =Parent.Height
                                                OnCheck: |-
                                                  =// Completar: guarda el estado anterior (para poder restaurarlo), pone Avance 100 y recalcula el proyecto
                                                  If(
                                                      ThisItem.Estado.Value <> "Completado",
                                                      RemoveIf(colEstadoPrevio, Tipo = "Hito" && ID = ThisItem.ID);
                                                      Collect(colEstadoPrevio, { Tipo: "Hito", ID: ThisItem.ID, Estado: ThisItem.Estado.Value, Avance: Coalesce(ThisItem.Avance, 0) });
                                                      If(
                                                          IsError(
                                                              Patch(
                                                                  ColHitos,
                                                                  LookUp(ColHitos, ID = ThisItem.ID),
                                                                  Patch(Hitos, LookUp(Hitos, ID = ThisItem.ID), { Estado: { Value: "Completado" }, Avance: 100 })
                                                              )
                                                          ),
                                                          Notify("No se pudo actualizar el estado del hito.", NotificationType.Error),
                                                          With(
                                                              { _idP: ThisItem.'ID proyecto' },
                                                              // RECALC-PROGRESO: Progreso y SPI del proyecto _idP con TODOS sus hitos (copia idéntica en scrFormularioHito, cmpPopupEliminar, scrInicio y scrMisHitos)
                                                  With(
                                                      {
                                                          _p: LookUp(Proyectos, ID = _idP),
                                                          _h: Filter(Hitos, 'ID proyecto' = _idP)
                                                      },
                                                      With(
                                                          {
                                                              _t: Sum(_h, Coalesce(Peso, 0)),
                                                              _c: Sum(_h, Coalesce(Peso, 0) * Coalesce(Avance, 0) / 100),
                                                              _ini: _p.'Fecha creación caso aprovisionamiento ',
                                                              _fin: _p.Fecha_Fin
                                                          },
                                                          With(
                                                              {
                                                                  _real: If(_t = 0, 0, Round(_c / _t, 2)),
                                                                  _plan: If(
                                                                      IsBlank(_ini) || IsBlank(_fin), Blank(),
                                                                      Today() <= _ini, 0,
                                                                      Today() >= _fin, 1,
                                                                      DateDiff(_ini, Today(), TimeUnit.Days) / Max(1, DateDiff(_ini, _fin, TimeUnit.Days))
                                                                  )
                                                              },
                                                              With(
                                                                  {
                                                                      _cambios: {
                                                                          Progreso: _real * 100,
                                                                          SPI: If(IsBlank(_plan), Blank(), _plan = 0, If(_real = 0, 1, 0), _real / _plan)
                                                                      }
                                                                  },
                                                                  If(
                                                                      !IsBlank(_p),
                                                                      If(
                                                                          IsError(Patch(Proyectos, _p, _cambios)),
                                                                          Notify("No se pudo actualizar Progreso/SPI del proyecto.", NotificationType.Error),
                                                                          If(
                                                                              !IsBlank(LookUp(ColProyectos, ID = _idP)),
                                                                              Patch(ColProyectos, LookUp(ColProyectos, ID = _idP), _cambios)
                                                                          )
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      )
                                                  )
                                                          )
                                                      )
                                                  )
                                                OnUncheck: |-
                                                  =// Desmarcar: vuelve al estado y avance anteriores (si se conocen en esta sesión); si no, "En progreso" sin tocar el avance
                                                  If(
                                                      ThisItem.Estado.Value = "Completado",
                                                      With(
                                                          { _prev: LookUp(colEstadoPrevio, Tipo = "Hito" && ID = ThisItem.ID) },
                                                          If(
                                                              IsError(
                                                                  Patch(
                                                                      ColHitos,
                                                                      LookUp(ColHitos, ID = ThisItem.ID),
                                                                      Patch(
                                                                          Hitos,
                                                                          LookUp(Hitos, ID = ThisItem.ID),
                                                                          {
                                                                              Estado: { Value: Coalesce(_prev.Estado, "En progreso") },
                                                                              Avance: If(IsBlank(_prev), ThisItem.Avance, _prev.Avance)
                                                                          }
                                                                      )
                                                                  )
                                                              ),
                                                              Notify("No se pudo actualizar el estado del hito.", NotificationType.Error),
                                                              RemoveIf(colEstadoPrevio, Tipo = "Hito" && ID = ThisItem.ID);
                                                              With(
                                                                  { _idP: ThisItem.'ID proyecto' },
                                                                  // RECALC-PROGRESO: Progreso y SPI del proyecto _idP con TODOS sus hitos (copia idéntica en scrFormularioHito, cmpPopupEliminar, scrInicio y scrMisHitos)
                                                  With(
                                                      {
                                                          _p: LookUp(Proyectos, ID = _idP),
                                                          _h: Filter(Hitos, 'ID proyecto' = _idP)
                                                      },
                                                      With(
                                                          {
                                                              _t: Sum(_h, Coalesce(Peso, 0)),
                                                              _c: Sum(_h, Coalesce(Peso, 0) * Coalesce(Avance, 0) / 100),
                                                              _ini: _p.'Fecha creación caso aprovisionamiento ',
                                                              _fin: _p.Fecha_Fin
                                                          },
                                                          With(
                                                              {
                                                                  _real: If(_t = 0, 0, Round(_c / _t, 2)),
                                                                  _plan: If(
                                                                      IsBlank(_ini) || IsBlank(_fin), Blank(),
                                                                      Today() <= _ini, 0,
                                                                      Today() >= _fin, 1,
                                                                      DateDiff(_ini, Today(), TimeUnit.Days) / Max(1, DateDiff(_ini, _fin, TimeUnit.Days))
                                                                  )
                                                              },
                                                              With(
                                                                  {
                                                                      _cambios: {
                                                                          Progreso: _real * 100,
                                                                          SPI: If(IsBlank(_plan), Blank(), _plan = 0, If(_real = 0, 1, 0), _real / _plan)
                                                                      }
                                                                  },
                                                                  If(
                                                                      !IsBlank(_p),
                                                                      If(
                                                                          IsError(Patch(Proyectos, _p, _cambios)),
                                                                          Notify("No se pudo actualizar Progreso/SPI del proyecto.", NotificationType.Error),
                                                                          If(
                                                                              !IsBlank(LookUp(ColProyectos, ID = _idP)),
                                                                              Patch(ColProyectos, LookUp(ColProyectos, ID = _idP), _cambios)
                                                                          )
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      )
                                                  )
                                                              )
                                                          )
                                                      )
                                                  )
                                                PaddingBottom: =3
                                                PaddingLeft: =Espacio.XS
                                                PressedBorderColor: =RGBA(0, 0, 0, 0)
                                                PressedColor: =RGBA(50, 49, 48, 1)
                                                PressedFill: =RGBA(0, 0, 0, 0)
                                                Text: =
                                                Width: =50
                                          - lblCeldaNombreHito:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
                                                BorderColor: =MyTheme.LightGray
                                                BorderThickness: =4
                                                Color: =Colores.Texto
