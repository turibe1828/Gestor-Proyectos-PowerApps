                                                Text: =Text(ThisItem.Fecha_Inicio, "yyyy-mm-dd")
                                          - lblCeldaFinHito:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                AutoHeight: =true
