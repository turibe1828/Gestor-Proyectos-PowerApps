                                                        =// Encargado del hito: foto, o avatar con iniciales, o SampleImage
                                                        Table(
                                                            {
                                                                Email: ThisItem.Encargado.Email,
                                                                Displayname: ThisItem.Encargado.DisplayName,
                                                                UserPhoto: // Foto de Office 365 si la tiene; si no, avatar con iniciales; si no hay nombre, SampleImage
                                                        If(
                                                            // Foto desde la caché colFotos (App.OnStart): sin llamadas a Office 365 por fila
                                                            !IsBlank(LookUp(colFotos, Mail = Lower(ThisItem.Encargado.Email))),
                                                            LookUp(colFotos, Mail = Lower(ThisItem.Encargado.Email)).Foto,
                                                            // Avatar: círculo SVG con las iniciales y un color estable por persona; sin nombre → SampleImage
                                                        With(
                                                            { _partes: Split(Trim(Coalesce(ThisItem.Encargado.DisplayName, "")), " ") },
                                                            With(
                                                                { _ini: Upper(Left(First(_partes).Value, 1) & If(CountRows(_partes) > 1, Left(Last(_partes).Value, 1), "")) },
                                                                If(
                                                                    IsBlank(_ini),
                                                                    SampleImage,
                                                                    "data:image/svg+xml;utf8," & EncodeUrl(
                                                                        "<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><circle cx='40' cy='40' r='40' fill='" &
                                                                        Index(
                                                                            ["#2563EB", "#0E9F6E", "#D97706", "#7C3AED", "#DB2777", "#0891B2"],
                                                                            Mod(Coalesce(Find(Left(_ini, 1), "ABCDEFGHIJKLMNOPQRSTUVWXYZ"), 0) + Len(ThisItem.Encargado.DisplayName), 6) + 1
                                                                        ).Value &
                                                                        "'/><text x='40' y='40' dy='0.35em' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' font-size='30' font-weight='600' fill='#FFFFFF'>" &
                                                                        _ini & "</text></svg>"
                                                                    )
                                                                )
                                                            )
                                                        )
