                                                      If(IsBlank(_d), RGBA(50, 49, 48, 1), _d < 0, ColorValue("#DC2626"), _d <= 7, ColorValue("#D97706"), RGBA(50, 49, 48, 1))
                                                  )
                                                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                DisabledColor: =RGBA(161, 159, 157, 1)
