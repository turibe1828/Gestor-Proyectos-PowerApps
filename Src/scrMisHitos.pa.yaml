                                                LayoutMinWidth: =(Parent.Width/6)-chkHitoCompletado.Width
                                                PaddingLeft: =Espacio.M
                                                Size: =Fuente.Normal
                                                Strikethrough: =ThisItem.Estado.Value="Completado"
                                                Text: =ThisItem.'Nombre del hito'
                                                Wrap: =false
                                          - lblCeldaInicioHito:
                                              Control: Label@2.5.1
