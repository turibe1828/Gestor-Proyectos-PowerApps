Screens:
  scrMisProyectos:
    Properties:
      Fill: =Colores.Blanco
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Reset(cmbClienteMisProyectos);
        Reset(cmbSegmentoMisProyectos);
        Reset(cmbEstadoMisProyectos);
        Reset(cmbResponsableMisProyectos);
    Children:
      - cntPantallaMisProyectos:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - cmpMenuLateralMisProyectos:
                Control: CanvasComponent
                ComponentName: cmpMenuLateral
                Properties:
                  Visible: =App.ActiveScreenSize > ScreenSize.Small || VarMenu
                  Height: =Parent.Height
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Width: =If(App.ActiveScreenSize = ScreenSize.Small, If(VarMenu, Parent.Width, 0), If(VarMenu, 200, 70))
            - cntPrincipalMisProyectos:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutMinWidth: =0
                  FillPortions: =1
                  Visible: =!(App.ActiveScreenSize = ScreenSize.Small && VarMenu)
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmpEncabezadoMisProyectos:
                      Control: CanvasComponent
                      ComponentName: cmpEncabezado
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        Height: =60
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =0
                        Width: =Max(Parent.Width, 300)
                  - cntBarraHerramientasMisProyectos:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(App.ActiveScreenSize <= ScreenSize.Medium, 110, Max(60, Parent.Height * 0.08))
                        LayoutDirection: =If(App.ActiveScreenSize <= ScreenSize.Medium, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lblTituloMisProyectos:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Align: =If(App.ActiveScreenSize <= ScreenSize.Medium, Align.Left, Align.Center)
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =If(IsBlank(varFiltroRapidoP) && IsBlank(varRespFoco), RGBA(50, 49, 48, 1), MyTheme.Primary)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Lato Black'
                              Height: =If(App.ActiveScreenSize <= ScreenSize.Medium, 45, Parent.Height)
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =// Clic en el título con filtros rápidos activos: los quita
                                Set(varFiltroRapidoP, Blank());
                                Set(varRespFoco, Blank());
                                Set(varRespFocoNombre, Blank())
                              PaddingLeft: =Espacio.L
                              Size: =If(IsBlank(varFiltroRapidoP) && IsBlank(varRespFoco), 14, 12)
                              Text: |-
                                ="Proyectos" &
                                If(
                                    IsBlank(varFiltroRapidoP) && IsBlank(varRespFoco),
                                    "",
                                    "  ·  " & Concat(Filter(Table({ t: varFiltroRapidoP }, { t: varRespFocoNombre }), !IsBlank(t)), t, " + ") & "  ✕"
                                )
                              Tooltip: =If(IsBlank(varFiltroRapidoP) && IsBlank(varRespFoco), "", "Clic para quitar los filtros rápidos")
                              Width: =If(IsBlank(varFiltroRapidoP) && IsBlank(varRespFoco), 250, 380)
                        - cntFiltrosMisProyectos:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              BorderColor: =Blank()
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Fill: =Colores.Blanco
                              Height: =60
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =Espacio.XS
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingRight: =Espacio.L
                              PaddingTop: =Espacio.XS
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(App.ActiveScreenSize <= ScreenSize.Medium, Parent.Width, Parent.Width - lblTituloMisProyectos.Width)
                            Children:
                              - txtBuscarMisProyectos:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    BorderRadius: =4
                                    Font: =Font.Lato
                                    FontColor: =MyTheme.Gray
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Placeholder: ="Buscar"
                                    TriggerOutput: ='TextInputCanvas.TriggerOutput'.Delayed
                                    Value: =
                                    Width: =If(App.ActiveScreenSize = ScreenSize.Small, Parent.Width * 0.65, If(App.ActiveScreenSize = ScreenSize.Medium, Parent.Width * 0.3, Parent.Width / 5)) - Parent.LayoutGap
                              - btnBuscarMisProyectos:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Buscar"
                                    Align: =Align.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BorderThickness: =0
                                    FontColor: =RGBA(15, 108, 189, 1)
                                    FontSize: =30
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height - Parent.PaddingTop - Parent.PaddingBottom
                                    Icon: ="Search"
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Self.Height
                              - cmbResponsableMisProyectos:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    Font: =Font.Lato
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    InputTextPlaceholder: ="PM"
                                    Items: |-
                                      =// PM disponibles según Segmento, Estado y texto de búsqueda
                                      With(
                                          {   
                                              _cli: cmbClienteMisProyectos.Selected.Value,
                                              _seg: cmbSegmentoMisProyectos.Selected.Value,
                                              _est: cmbEstadoMisProyectos.Selected.Value,
                                              _txt: Trim(txtBuscarMisProyectos.Value)   // usa .Text si es TextInput
                                          },
                                          With(
                                              {
                                                  _src: Filter(
                                                      ColProyectos,
                                                      // Segmento
                                                      IsBlank(_seg) || Segmento.Value = _seg,
                                                      IsBlank(_cli) || 'Nombre del Cliente' = _cli,
                                                      // Estado
                                                      IsBlank(_est) || Estado.Value = _est,
                                                      // Texto (si quieres más delegable, cambia "in" por StartsWith)
                                                      IsBlank(_txt)
                                                          || _txt in 'Nombre del proyecto'
                                                          || _txt in NumeroCaso
                                                          || _txt in 'Nombre del Cliente'
                                                  )
                                              },
                                              With(
                                                  { _flat: Ungroup(AddColumns(_src, R, Responsable), R) },
                                                  With(
                                                      // Calculamos el email en minúsculas para evitar duplicados por mayúsculas
                                                      { _flat2: AddColumns(_flat, eLower_1, Lower(Coalesce(Email, ""))) },
                                                      With(
                                                          // Distinct devuelve "Result"; lo renombramos a "Value"
                                                          { _emails: RenameColumns(Distinct(_flat2, eLower_1), Value, Value) },
                                                          SortByColumns(
                                                              // Para cada email único, tomamos 1 registro representativo
                                                              ForAll(
                                                                  _emails As E,
                                                                  LookUp(_flat2, eLower_1 = E.Value)
                                                              ),
                                                              "DisplayName",
                                                              SortOrder.Ascending
                                                          )
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =30
                                    OnChange: =
                                    PaddingBottom: =Espacio.M
                                    PaddingTop: =Espacio.M
                                    SelectMultiple: =true
                                    Visible: =varAccesoTotal && App.ActiveScreenSize > ScreenSize.Small
                                    Width: =If(App.ActiveScreenSize = ScreenSize.Medium, Parent.Width * 0.22, Parent.Width * 0.15) - Parent.LayoutGap
                                  Children:
                                    - fldResponsableMisProyectos:
                                        Control: ComboBoxDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="DisplayName"
                                          FieldName: ="DisplayName"
                                          FieldType: ="s"
                                          Order: =1
                              - cmbClienteMisProyectos:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    Font: =Font.Lato
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    InputTextPlaceholder: ="Cliente"
                                    Items: =Distinct(ColProyectos.'Nombre del Cliente', ThisRecord.'Nombre del Cliente')
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =30
                                    PaddingBottom: =Espacio.M
                                    PaddingTop: =Espacio.M
                                    SelectMultiple: =true
                                    Visible: =varAccesoTotal && App.ActiveScreenSize >= ScreenSize.Large
                                    Width: =Parent.Width * 0.15 - Parent.LayoutGap
                                  Children:
                                    - fldClienteMisProyectos:
                                        Control: ComboBoxDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="Value"
                                          FieldName: ="Value"
                                          FieldType: ="s"
                                          Order: =1
                              - cmbEstadoMisProyectos:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    Visible: =App.ActiveScreenSize > ScreenSize.Small
                                    Font: =Font.Lato
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    InputTextPlaceholder: ="Estado"
                                    Items: =Distinct(ColProyectos.Estado, ThisRecord.Estado.Value)
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Width: =If(App.ActiveScreenSize = ScreenSize.Medium, Parent.Width * 0.22, Parent.Width * 0.15) - Parent.LayoutGap
                                  Children:
                                    - fldEstadoMisProyectos:
                                        Control: ComboBoxDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="Value"
                                          FieldName: ="Value"
                                          FieldType: ="s"
                                          Order: =1
                              - cmbSegmentoMisProyectos:
                                  Control: ComboBox@0.0.51
                                  Properties:
                                    Font: =Font.Lato
                                    FontSize: =12
                                    Height: =Parent.Height*0.8 - Parent.PaddingTop - Parent.PaddingBottom
                                    InputTextPlaceholder: ="Segmento"
                                    Items: =Distinct(ColProyectos.Segmento, ThisRecord.Segmento.Value)
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    SelectMultiple: =true
                                    Visible: =varAccesoTotal && App.ActiveScreenSize >= ScreenSize.Large
                                    Width: =Parent.Width * 0.15 - Parent.LayoutGap
                                  Children:
                                    - fldSegmentoMisProyectos:
                                        Control: ComboBoxDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="Value"
                                          FieldName: ="Value"
                                          FieldType: ="s"
                                          Order: =1
                              - btnQuitarFiltrosMisProyectos:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Quitar filtros"
                                    Align: =Align.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BorderThickness: =0
                                    FontColor: =RGBA(189, 49, 51, 1)
                                    FontSize: =30
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height - Parent.PaddingTop - Parent.PaddingBottom
                                    Icon: ="Eraser"
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |-
                                      =Reset(txtBuscarMisProyectos);
                                      Reset(cmbEstadoMisProyectos);
                                      Reset(cmbResponsableMisProyectos);
                                      Reset(cmbSegmentoMisProyectos);
                                      Reset(cmbClienteMisProyectos);
                                      // Filtros rápidos (chips, indicadores de Inicio, responsable y columna ampliada)
                                      Set(varFiltroRapidoP, Blank());
                                      Set(varRespFoco, Blank());
                                      Set(varRespFocoNombre, Blank());
                                      Set(varEstadoFocoP, Blank())
                                    Text: =""
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =Self.Height
                  - galVistasMisProyectos:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        BorderColor: =Colores.FondoSuave
                        BorderStyle: =BorderStyle.None
                        FillPortions: =0
                        Height: =40
                        Items: |-
                          =// 1-2: pestañas de vista. 3-5: filtros rápidos (un clic filtra, otro clic lo quita)
                          [
                              {ID:1, title:"Tablero"},
                              {ID:2, title:"Lista"},
                              {ID:3, title:"Vencidos"},
                              {ID:4, title:"Vence ≤ 7 d"},
                              {ID:5, title:"En riesgo"}
                          ]
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =0
                        TemplatePadding: =0
                        TemplateSize: =120
                      Children:
                        - btnVistaMisProyectos:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: |-
                                =If(
                                    ThisItem.ID <= 2, If(varVista = ThisItem.title, MyTheme.Primary, MyTheme.Gray),
                                    varFiltroRapidoP = ThisItem.title, Color.White,
                                    MyTheme.Gray
                                )
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              Fill: =If(ThisItem.ID > 2 && varFiltroRapidoP = ThisItem.title, MyTheme.Primary, If(ThisItem.ID > 2, MyTheme.LightGray, RGBA(0, 0, 0, 0)))
                              Font: =Font.'Lato Black'
                              Height: =If(ThisItem.ID > 2, Parent.TemplateHeight - 8, Parent.TemplateHeight)
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =If(ThisItem.ID > 2 && varFiltroRapidoP = ThisItem.title, Color.White, MyTheme.Primary)
                              HoverFill: =If(ThisItem.ID > 2, ColorFade(Self.Fill, -8%), Color.Transparent)
                              OnSelect: |-
                                =If(
                                    ThisItem.ID <= 2,
                                    Set(varVista, ThisItem.title),
                                    Set(varFiltroRapidoP, If(varFiltroRapidoP = ThisItem.title, Blank(), ThisItem.title))
                                )
                              PressedBorderColor: =Color.Transparent
                              PressedColor: =ColorFade(Self.HoverColor, -20%)
                              PressedFill: =Color.Transparent
                              RadiusBottomLeft: =If(ThisItem.ID > 2, 16, 0)
                              RadiusBottomRight: =If(ThisItem.ID > 2, 16, 0)
                              RadiusTopLeft: =If(ThisItem.ID > 2, 16, 0)
                              RadiusTopRight: =If(ThisItem.ID > 2, 16, 0)
                              Size: =If(ThisItem.ID > 2, 11, 14)
                              Text: =ThisItem.title
                              Tooltip: =If(ThisItem.ID > 2, "Clic para filtrar; otro clic quita el filtro", "")
                              Width: =If(ThisItem.ID > 2, Parent.TemplateWidth - 8, Parent.TemplateWidth)
                              Y: =If(ThisItem.ID > 2, 4, 0)
                  - galTableroProyectos:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        BorderColor: =Colores.FondoSuave
                        BorderStyle: =BorderStyle.None
                        DelayItemLoading: =false
                        Fill: =MyTheme.LightGray
                        Items: |-
                          =// Clic en el título de una columna: se muestra solo esa columna, a todo el ancho y en cuadrícula
                          If(IsBlank(varEstadoFocoP), EstadosProyecto, Filter(EstadosProyecto, Value = varEstadoFocoP))
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =If(IsBlank(varEstadoFocoP), If(App.ActiveScreenSize = ScreenSize.Small, Self.Width * 0.85, 290), Max(290, Self.Width))
                        Visible: =varVista= "Tablero"
                        Width: =Parent.Width
                      Children:
                        - lblColumnaTableroProyectos:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =If(IsBlank(varEstadoFocoP), RGBA(50, 49, 48, 1), MyTheme.Primary)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Lato Black'
                              HoverColor: =MyTheme.Primary
                              OnSelect: =Set(varEstadoFocoP, If(IsBlank(varEstadoFocoP), ThisItem.Value, Blank()))
                              Size: =Fuente.Media
                              Text: =ThisItem.Value & "  (" & galTarjetasProyectos.AllItemsCount & ")" & If(IsBlank(varEstadoFocoP), "", "   ‹ volver")
                              Tooltip: =If(IsBlank(varEstadoFocoP), "Clic para ampliar esta columna", "Clic para volver a ver todas las columnas")
                              Width: =Parent.TemplateWidth-Self.X
                              X: =50
                              Y: =15
                        - btnColorColumnaProyectos:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =Colores.Blanco
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: =DisplayMode.View
                              Fill: |-
                                =Switch(
                                    ThisItem.Value,
                                    "Completado",MyTheme.Green,
                                    "En progreso",MyTheme.DarkBlue,
                                    "Stand By", MyTheme.Yellow,
                                    "Cancelado", MyTheme.Orange,
                                    Color.Transparent
                                )
                              Font: =Font.'Segoe UI'
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(16, 110, 190, 1)
                              PressedBorderColor: =RGBA(0, 69, 120, 1)
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(16, 110, 190, 1)
                              Text: =
                              Width: =20
                              X: =15
                              Y: =15
                        - galTarjetasProyectos:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =Colores.FondoSuave
                              DelayItemLoading: =false
                              Height: =Parent.Height-Self.Y
                              Items: |-
                                =// Mismo filtro que la vista Lista (galTablaProyectos). ColProyectos ya viene filtrada por rol desde la carga.
                                With(
                                    {
                                        _txt: txtBuscarMisProyectos.Value,
                                        _est: cmbEstadoMisProyectos.Selected.Value,
                                        _resp: ForAll(cmbResponsableMisProyectos.SelectedItems, Lower(Email)),
                                        _seg: ForAll(cmbSegmentoMisProyectos.SelectedItems, Lower(Value)),
                                        _cli: ForAll(cmbClienteMisProyectos.SelectedItems, Lower(Value))
                                    },
                                    Filter(
                                        ColProyectos,
                                        Estado.Value = ThisItem.Value,
                                        IsBlank(_est) || Estado.Value = _est,
                                        IsBlank(_txt) || _txt in 'Nombre del proyecto' || _txt in Text(NumeroCaso) || _txt in 'Nombre del Cliente',
                                        IsEmpty(_resp) || CountIf(Responsable, Lower(Email) in _resp) > 0,
                                        IsEmpty(_seg) || Lower(Segmento.Value) in _seg,
                                        IsEmpty(_cli) || Lower('Nombre del Cliente') in _cli,
                                        // FILTRO-RAPIDO-PROYECTOS (copia idéntica en galTablaProyectos): chips, indicadores de Inicio y responsable
                                        IsBlank(varFiltroRapidoP) || Switch(
                                            varFiltroRapidoP,
                                            "Vencidos", Estado.Value = "En progreso" && !IsBlank(Fecha_Fin) && Fecha_Fin < Today(),
                                            "Vence ≤ 7 d", Estado.Value = "En progreso" && !IsBlank(Fecha_Fin) && Fecha_Fin >= Today() && Fecha_Fin <= DateAdd(Today(), 7, TimeUnit.Days),
                                            "Completados 30 d", Estado.Value = "Completado" && Fecha_Completado >= DateAdd(Today(), -30, TimeUnit.Days),
                                            // Mismo criterio que el semáforo: abierto, no vencido y avance real < 90 % del planificado
                                            "En riesgo", !(Estado.Value in ["Completado", "Cancelado"]) && !IsBlank(Fecha_Fin) && Fecha_Fin >= Today() &&
                                                With(
                                                    { _id: ID, _ini: 'Fecha creación caso aprovisionamiento ', _ff: Fecha_Fin },
                                                    With(
                                                        { _r: LookUp(ResumenHitosProyecto, IDproyecto = _id) },
                                                        !IsBlank(_ini) && Today() > _ini &&
                                                        If(Coalesce(_r.PesoTotal, 0) = 0, 0, _r.PesoHecho / _r.PesoTotal) <
                                                            0.9 * Min(1, DateDiff(_ini, Today(), TimeUnit.Days) / Max(1, DateDiff(_ini, _ff, TimeUnit.Days)))
                                                    )
                                                ),
                                            true
                                        ),
                                        IsBlank(varRespFoco) || CountIf(Responsable, Lower(Email) = varRespFoco) > 0
                                    )
                                )
                              ShowScrollbar: =false
                              TemplatePadding: =15
                              TemplateSize: =160
                              Width: =Parent.TemplateWidth
                              WrapCount: =If(IsBlank(varEstadoFocoP), 1, Max(1, RoundDown(Self.Width / 290, 0)))
                              Y: =80
                            Children:
                              - cntTarjetaProyecto:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Fill: =Colores.Blanco
                                    Height: =Parent.TemplateHeight
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =Espacio.XS
                                    PaddingBottom: =Espacio.XS
                                    PaddingLeft: =15
                                    PaddingRight: =15
                                    PaddingTop: =Espacio.XS
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - cntCabeceraTarjetaProyecto:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinHeight: =35
                                          LayoutMinWidth: =0
                                          PaddingTop: =Espacio.M
                                          RadiusBottomLeft: =0
