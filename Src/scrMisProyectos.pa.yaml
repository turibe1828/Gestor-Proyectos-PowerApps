                                                  Switch(
                                                      First(Split(Self.Tooltip, " ·")).Value,
                                                      "Completado", ColorValue("#16A34A"),
                                                      "Vencido", ColorValue("#DC2626"),
                                                      "En riesgo", ColorValue("#D97706"),
