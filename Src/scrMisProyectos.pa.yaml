                                                LayoutMaxWidth: =
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =(Parent.Width/9)-chkProyectoCompletado.Width
                                                PaddingLeft: =Espacio.M
                                                Size: =Fuente.Normal
                                                Text: |-
                                                  =If(IsBlank(ThisItem.Facturacion_Pendiente) || ThisItem.Facturacion_Pendiente=0,"$ 0", Text(ThisItem.Facturacion_Pendiente, "[$-es-ES]$ #.##0"))
                                                Wrap: =false
                                          - cntCeldaResponsablesProyecto:
                                              Control: GroupContainer@1.5.0
                                              Variant: ManualLayout
                                              Properties:
                                                BorderColor: =MyTheme.LightGray
                                                BorderThickness: =4
                                                DropShadow: =DropShadow.None
                                                Fill: =Colores.Blanco
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =(Parent.Width/9)-chkProyectoCompletado.Width+70
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =125
                                              Children:
                                                - galFotosResponsables:
                                                    Control: Gallery@2.15.0
                                                    Variant: Horizontal
                                                    Properties:
                                                      BorderColor: =Colores.FondoSuave
                                                      Height: =Parent.Height
                                                      Items: |-
                                                        =// 1-2 responsables por tarjeta: foto, o avatar con iniciales, o SampleImage
                                                        ForAll(
                                                            FirstN(ThisItem.Responsable, 2) As Responsable,
                                                            {
                                                                Email: Responsable.Email,
                                                                Displayname: Responsable.DisplayName,
                                                                UserPhoto: // Foto de Office 365 si la tiene; si no, avatar con iniciales; si no hay nombre, SampleImage
                                                        If(
                                                            // Foto desde la caché colFotos (App.OnStart): sin llamadas a Office 365 por tarjeta
                                                            !IsBlank(LookUp(colFotos, Mail = Lower(Responsable.Email))),
                                                            LookUp(colFotos, Mail = Lower(Responsable.Email)).Foto,
                                                            // Avatar: círculo SVG con las iniciales y un color estable por persona; sin nombre → SampleImage
                                                        With(
                                                            { _partes: Split(Trim(Coalesce(Responsable.DisplayName, "")), " ") },
                                                            With(
                                                                { _ini: Upper(Left(First(_partes).Value, 1) & If(CountRows(_partes) > 1, Left(Last(_partes).Value, 1), "")) },
                                                                If(
                                                                    IsBlank(_ini),
                                                                    SampleImage,
                                                                    "data:image/svg+xml;utf8," & EncodeUrl(
                                                                        "<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><circle cx='40' cy='40' r='40' fill='" &
                                                                        Index(
                                                                            ["#2563EB", "#0E9F6E", "#D97706", "#7C3AED", "#DB2777", "#0891B2"],
                                                                            Mod(Coalesce(Find(Left(_ini, 1), "ABCDEFGHIJKLMNOPQRSTUVWXYZ"), 0) + Len(Responsable.DisplayName), 6) + 1
                                                                        ).Value &
                                                                        "'/><text x='40' y='40' dy='0.35em' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' font-size='30' font-weight='600' fill='#FFFFFF'>" &
                                                                        _ini & "</text></svg>"
                                                                    )
                                                                )
                                                            )
                                                        )
                                                        ),
                                                                UserInitials: ""
                                                            }
                                                        )
                                                      ShowScrollbar: =false
                                                      TemplatePadding: =0
                                                      TemplateSize: =50
                                                      Width: =Parent.Width
                                                    Children:
                                                      - imgFotoResponsable:
                                                          Control: Image@2.2.3
                                                          Properties:
                                                            BorderColor: =If(varRespFoco = Lower(ThisItem.Email), MyTheme.Primary, RGBA(0, 0, 0, 0))
                                                            BorderThickness: =If(varRespFoco = Lower(ThisItem.Email), 3, 0)
                                                            DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                            DisabledFill: =RGBA(0, 0, 0, 0)
                                                            FocusedBorderThickness: =4
                                                            Height: =35
                                                            HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                            HoverFill: =
                                                            Image: =ThisItem.UserPhoto
                                                            OnSelect: |-
                                                              =// Clic en un responsable: muestra solo sus proyectos (otro clic, o clic en el título, lo quita)
                                                              If(
                                                                  varRespFoco = Lower(ThisItem.Email),
                                                                  Set(varRespFoco, Blank()); Set(varRespFocoNombre, Blank()),
                                                                  Set(varRespFoco, Lower(ThisItem.Email)); Set(varRespFocoNombre, ThisItem.Displayname);
                                                                  Notify("Mostrando los proyectos de " & ThisItem.Displayname, NotificationType.Information)
                                                              )
                                                            PressedBorderColor: =RGBA(0, 0, 0, 0)
                                                            PressedFill: =RGBA(0, 0, 0, 0)
                                                            RadiusBottomLeft: =25
                                                            RadiusBottomRight: =25
                                                            RadiusTopLeft: =25
                                                            RadiusTopRight: =25
                                                            Tooltip: =ThisItem.Displayname & " · clic para ver solo sus proyectos"
                                                            Width: =35
                                                            X: =15
                                                            Y: =(Parent.TemplateHeight-Self.Height)/2
                                                      - btnInicialesResponsable:
                                                          Control: Classic/Button@2.2.0
                                                          Properties:
                                                            BorderColor: =RGBA(0, 0, 0, 0)
                                                            BorderStyle: =BorderStyle.None
                                                            Color: =MyTheme.Primary
                                                            DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                            DisabledColor: =RGBA(161, 159, 157, 1)
                                                            DisabledFill: =RGBA(242, 242, 241, 0)
                                                            Fill: =RGBA(181, 206, 245,255)
                                                            Font: =Font.'Segoe UI'
                                                            Height: =35
                                                            HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                            HoverColor: =RGBA(255, 255, 255, 1)
                                                            HoverFill: =RGBA(16, 110, 190, 1)
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingRight: =0
                                                            PaddingTop: =0
                                                            PressedBorderColor: =RGBA(0, 69, 120, 1)
                                                            PressedColor: =RGBA(255, 255, 255, 1)
                                                            PressedFill: =RGBA(16, 110, 190, 1)
                                                            RadiusBottomLeft: =25
                                                            RadiusBottomRight: =25
                                                            RadiusTopLeft: =25
                                                            RadiusTopRight: =25
                                                            Text: =IfError(ThisItem.UserInitials,"NA")
                                                            Tooltip: =ThisItem.Displayname
                                                            Visible: =false
                                                            Width: =35
                                                            X: =15
                                                            Y: =(Parent.Height-Self.Height)/ 2
                                                - btnMasResponsables:
                                                    Control: Classic/Button@2.2.0
                                                    Properties:
                                                      BorderColor: =RGBA(0, 0, 0, 0)
                                                      BorderStyle: =BorderStyle.None
                                                      Color: =MyTheme.Gray
                                                      DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                      DisabledColor: =RGBA(161, 159, 157, 1)
                                                      DisabledFill: =RGBA(242, 242, 241, 0)
                                                      Fill: =RGBA(232,232,232,1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =35
                                                      HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                      HoverColor: =RGBA(255, 255, 255, 1)
                                                      HoverFill: =RGBA(16, 110, 190, 1)
                                                      OnSelect: |-
                                                        =// Clic en "+N": lista todos los responsables del proyecto
                                                        Notify("Responsables de " & ThisItem.'Nombre del proyecto' & ": " & Concat(ThisItem.Responsable, DisplayName, ", "), NotificationType.Information)
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      PressedBorderColor: =RGBA(0, 69, 120, 1)
                                                      PressedColor: =RGBA(255, 255, 255, 1)
                                                      PressedFill: =RGBA(16, 110, 190, 1)
                                                      RadiusBottomLeft: =25
                                                      RadiusBottomRight: =25
                                                      RadiusTopLeft: =25
                                                      RadiusTopRight: =25
                                                      Text: =$"+{CountRows(ThisItem.Responsable)-2}"
                                                      Tooltip: =Concat(ThisItem.Responsable, DisplayName, ", ")
                                                      Visible: =CountRows(ThisItem.Responsable)>2
                                                      Width: =35
                                                      X: =120
                                                      Y: =(Parent.Height-Self.Height)/ 2
                                    - btnAbrirFilaProyecto:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          Color: =Colores.Blanco
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          Fill: '=Color.Transparent  '
                                          Font: =Font.'Segoe UI'
                                          Height: =50
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =RGBA(190,190,240,0.1)
                                          OnSelect: '=Set(varProyecto, LookUp(ColProyectos, ID=ThisItem.ID)); Navigate(scrFormularioProyecto,ScreenTransition.Fade); '
                                          PressedBorderColor: =RGBA(0, 69, 120, 1)
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =ColorFade(Self.HoverFill, -30%)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Text: =
                                          Width: =Parent.Width-Self.X-cntCeldaResponsablesProyecto.Width
                                          X: =55
      - cmpPopupAgregarMisProyectos:
          Control: CanvasComponent
          ComponentName: cmpPopupAgregar
          Properties:
            Fill: =Colores.Velo
            Height: =App.Height
            Visible: =varAgregar
            Width: =App.Width
