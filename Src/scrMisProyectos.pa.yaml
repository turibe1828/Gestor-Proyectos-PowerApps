                                                      Notify(
                                                          ThisItem.'Nombre del proyecto' & " — " & Self.Tooltip &
                                                          " · Hitos completados " & Coalesce(_r.NumCompletados, 0) & " de " & Coalesce(_r.NumHitos, 0),
                                                          Switch(
