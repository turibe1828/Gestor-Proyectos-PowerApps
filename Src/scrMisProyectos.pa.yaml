                        - galTablaProyectos:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderColor: =Colores.FondoSuave
                              Fill: =MyTheme.LightGray
                              Items: |-
                                =// Mismo filtro que la vista Tablero. ColProyectos ya viene filtrada por rol desde la carga.
                                With(
                                    {
                                        _txt: txtBuscarMisProyectos.Value,
                                        _est: cmbEstadoMisProyectos.Selected.Value,
                                        _resp: ForAll(cmbResponsableMisProyectos.SelectedItems, Lower(Email)),
                                        _seg: ForAll(cmbSegmentoMisProyectos.SelectedItems, Lower(Value)),
                                        _cli: ForAll(cmbClienteMisProyectos.SelectedItems, Lower(Value))
                                    },
                                    SortByColumns(
                                        AddColumns(
                                            Filter(
                                                ColProyectos,
                                                IsBlank(_est) || Estado.Value = _est,
                                                IsBlank(_txt) || _txt in 'Nombre del proyecto' || _txt in Text(NumeroCaso) || _txt in 'Nombre del Cliente',
                                                IsEmpty(_resp) || CountIf(Responsable, Lower(Email) in _resp) > 0,
                                                IsEmpty(_seg) || Lower(Segmento.Value) in _seg,
                                                IsEmpty(_cli) || Lower('Nombre del Cliente') in _cli,
                                                // FILTRO-RAPIDO-PROYECTOS (copia idéntica en galTarjetasProyectos): chips, indicadores de Inicio y responsable
                                                IsBlank(varFiltroRapidoP) || Switch(
                                                    varFiltroRapidoP,
                                                    "Vencidos", Estado.Value = "En progreso" && !IsBlank(Fecha_Fin) && Fecha_Fin < Today(),
                                                    "Vence ≤ 7 d", Estado.Value = "En progreso" && !IsBlank(Fecha_Fin) && Fecha_Fin >= Today() && Fecha_Fin <= DateAdd(Today(), 7, TimeUnit.Days),
                                                    "Completados 30 d", Estado.Value = "Completado" && Fecha_Completado >= DateAdd(Today(), -30, TimeUnit.Days),
                                                    // Mismo criterio que el semáforo: abierto, no vencido y avance real < 90 % del planificado
                                                    "En riesgo", !(Estado.Value in ["Completado", "Cancelado"]) && !IsBlank(Fecha_Fin) && Fecha_Fin >= Today() &&
                                                        With(
                                                            { _id: ID, _ini: 'Fecha creación caso aprovisionamiento ', _ff: Fecha_Fin },
                                                            With(
                                                                { _r: LookUp(ResumenHitosProyecto, IDproyecto = _id) },
                                                                !IsBlank(_ini) && Today() > _ini &&
                                                                If(Coalesce(_r.PesoTotal, 0) = 0, 0, _r.PesoHecho / _r.PesoTotal) <
                                                                    0.9 * Min(1, DateDiff(_ini, Today(), TimeUnit.Days) / Max(1, DateDiff(_ini, _ff, TimeUnit.Days)))
                                                            )
                                                        ),
                                                    true
                                                ),
                                                IsBlank(varRespFoco) || CountIf(Responsable, Lower(Email) = varRespFoco) > 0
                                            ),
                                            // Columnas auxiliares para ordenar/mostrar
                                            EstadoValue, Estado.Value,
                                            Fecha_Inicio, 'Fecha creación caso aprovisionamiento '
                                        ),
                                        Coalesce(varOrdenColumna1, "Nombredelproyecto"),
                                        If(varOrdenDescendente1, SortOrder.Descending, SortOrder.Ascending)
                                    )
                                )
