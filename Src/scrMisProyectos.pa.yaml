                                                HoverFill: =RGBA(0, 0, 0, 0)
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                LayoutMinHeight: =Parent.Height
                                                OnCheck: |-
                                                  =// Completar: guarda el estado anterior para poder restaurarlo al desmarcar
                                                  If(
                                                      ThisItem.Estado.Value <> "Completado",
                                                      RemoveIf(colEstadoPrevio, Tipo = "Proyecto" && ID = ThisItem.ID);
                                                      Collect(colEstadoPrevio, { Tipo: "Proyecto", ID: ThisItem.ID, Estado: ThisItem.Estado.Value, Avance: 0 });
                                                      If(
                                                          IsError(
                                                              Patch(
                                                                  ColProyectos,
                                                                  LookUp(ColProyectos, ID = ThisItem.ID),
                                                                  Patch(Proyectos, LookUp(Proyectos, ID = ThisItem.ID), { Estado: { Value: "Completado" }, Fecha_Completado:Today() })
                                                              )
                                                          ),
                                                          Notify("No se pudo actualizar el estado del proyecto.", NotificationType.Error)
                                                      )
                                                  )
                                                OnUncheck: |
                                                  =// Desmarcar: vuelve al estado anterior (si se conoce en esta sesión); si no, "En progreso"
                                                  If(
                                                      ThisItem.Estado.Value = "Completado",
                                                      With(
                                                          { _prev: LookUp(colEstadoPrevio, Tipo = "Proyecto" && ID = ThisItem.ID) },
