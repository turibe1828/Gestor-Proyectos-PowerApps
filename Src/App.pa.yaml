      ClearCollect(
          Roles,
          { ID: 1, Title: "Ana", Nombre: LookUp(UsuariosDemo, Email = "ana.gomez@example.com"), Rol: { Value: "Gerente" }, Supervisor: LookUp(UsuariosDemo, Email = "carlos.diaz@example.com"), Created: DateAdd(Now(), -365, TimeUnit.Days) },
          { ID: 2, Title: "Luis", Nombre: LookUp(UsuariosDemo, Email = "luis.perez@example.com"), Rol: { Value: "PM" }, Supervisor: LookUp(UsuariosDemo, Email = "ana.gomez@example.com"), Created: DateAdd(Now(), -364, TimeUnit.Days) },
          { ID: 3, Title: "Marta", Nombre: LookUp(UsuariosDemo, Email = "marta.ruiz@example.com"), Rol: { Value: "PM" }, Supervisor: LookUp(UsuariosDemo, Email = "ana.gomez@example.com"), Created: DateAdd(Now(), -363, TimeUnit.Days) }
      );
      ClearCollect(
          Proyectos,
        { ID: 1, Title: "Portal de clientes", NumeroCaso: 2001, 'Nombre del proyecto': "Portal de clientes", 'Nombre del Cliente': "Cliente Ejemplo S.A.", Descripción: "Portal web de autoservicio para clientes", 'Fecha creación caso aprovisionamiento ': DateAdd(Today(), -60), 'Fecha asignación': DateAdd(Today(), -60), 'Tiempo implementación': 90, 'Fecha firma contrato': DateAdd(Today(), -60), 'Fecha Kick off Cliente': DateAdd(Today(), -60), Fecha_Fin: DateAdd(Today(), 45), 'Caso con pedidos completos': true, Responsable: Filter(UsuariosDemo, Email in ["luis.perez@example.com"]), Estado: { Value: "En progreso" }, Fecha_Completado: Blank(), Segmento: { Value: "Software" }, Financiación: 150000, Facturacion_acumulada: 60000, Facturacion_Pendiente: 90000, Progreso: 55, SPI: 0.95, 'Ingeniero Preventa': "Preventa Demo", 'Ejecutivo de Servicio': "Servicio Demo", 'Ejecutivo Comercial': "Comercial Demo", 'Facturación One_Time': { Value: "No" }, Facturador: "Facturación Demo", Created: DateAdd(Now(), -60, TimeUnit.Days) },
        { ID: 2, Title: "App de inventario", NumeroCaso: 2002, 'Nombre del proyecto': "App de inventario", 'Nombre del Cliente': "Industrias Muestra", Descripción: "Aplicación móvil para control de inventario", 'Fecha creación caso aprovisionamiento ': DateAdd(Today(), -90), 'Fecha asignación': DateAdd(Today(), -90), 'Tiempo implementación': 90, 'Fecha firma contrato': DateAdd(Today(), -90), 'Fecha Kick off Cliente': DateAdd(Today(), -90), Fecha_Fin: DateAdd(Today(), 5), 'Caso con pedidos completos': true, Responsable: Filter(UsuariosDemo, Email in ["marta.ruiz@example.com"]), Estado: { Value: "En progreso" }, Fecha_Completado: Blank(), Segmento: { Value: "Software" }, Financiación: 90000, Facturacion_acumulada: 70000, Facturacion_Pendiente: 20000, Progreso: 80, SPI: 1.02, 'Ingeniero Preventa': "Preventa Demo", 'Ejecutivo de Servicio': "Servicio Demo", 'Ejecutivo Comercial': "Comercial Demo", 'Facturación One_Time': { Value: "No" }, Facturador: "Facturación Demo", Created: DateAdd(Now(), -90, TimeUnit.Days) },
        { ID: 3, Title: "Migración de datos", NumeroCaso: 2003, 'Nombre del proyecto': "Migración de datos", 'Nombre del Cliente': "Comercial Demo Ltda.", Descripción: "Migración de la base de datos histórica", 'Fecha creación caso aprovisionamiento ': DateAdd(Today(), -120), 'Fecha asignación': DateAdd(Today(), -120), 'Tiempo implementación': 90, 'Fecha firma contrato': DateAdd(Today(), -120), 'Fecha Kick off Cliente': DateAdd(Today(), -120), Fecha_Fin: DateAdd(Today(), -10), 'Caso con pedidos completos': true, Responsable: Filter(UsuariosDemo, Email in ["luis.perez@example.com", "marta.ruiz@example.com"]), Estado: { Value: "En progreso" }, Fecha_Completado: Blank(), Segmento: { Value: "Servicios" }, Financiación: 60000, Facturacion_acumulada: 40000, Facturacion_Pendiente: 20000, Progreso: 70, SPI: 0.8, 'Ingeniero Preventa': "Preventa Demo", 'Ejecutivo de Servicio': "Servicio Demo", 'Ejecutivo Comercial': "Comercial Demo", 'Facturación One_Time': { Value: "No" }, Facturador: "Facturación Demo", Created: DateAdd(Now(), -120, TimeUnit.Days) },
        { ID: 4, Title: "Mesa de ayuda", NumeroCaso: 2004, 'Nombre del proyecto': "Mesa de ayuda", 'Nombre del Cliente': "Servicios Ficticios", Descripción: "Implementación de mesa de ayuda interna", 'Fecha creación caso aprovisionamiento ': DateAdd(Today(), -150), 'Fecha asignación': DateAdd(Today(), -150), 'Tiempo implementación': 90, 'Fecha firma contrato': DateAdd(Today(), -150), 'Fecha Kick off Cliente': DateAdd(Today(), -150), Fecha_Fin: DateAdd(Today(), -20), 'Caso con pedidos completos': true, Responsable: Filter(UsuariosDemo, Email in ["marta.ruiz@example.com"]), Estado: { Value: "Completado" }, Fecha_Completado: DateAdd(Today(), -18), Segmento: { Value: "Servicios" }, Financiación: 45000, Facturacion_acumulada: 45000, Facturacion_Pendiente: 0, Progreso: 100, SPI: 1, 'Ingeniero Preventa': "Preventa Demo", 'Ejecutivo de Servicio': "Servicio Demo", 'Ejecutivo Comercial': "Comercial Demo", 'Facturación One_Time': { Value: "No" }, Facturador: "Facturación Demo", Created: DateAdd(Now(), -150, TimeUnit.Days) },
        { ID: 5, Title: "Tablero comercial", NumeroCaso: 2005, 'Nombre del proyecto': "Tablero comercial", 'Nombre del Cliente': "Logística Prueba", Descripción: "Tablero de indicadores comerciales", 'Fecha creación caso aprovisionamiento ': DateAdd(Today(), -30), 'Fecha asignación': DateAdd(Today(), -30), 'Tiempo implementación': 90, 'Fecha firma contrato': DateAdd(Today(), -30), 'Fecha Kick off Cliente': DateAdd(Today(), -30), Fecha_Fin: DateAdd(Today(), 90), 'Caso con pedidos completos': true, Responsable: Filter(UsuariosDemo, Email in ["luis.perez@example.com"]), Estado: { Value: "Stand By" }, Fecha_Completado: Blank(), Segmento: { Value: "Otros" }, Financiación: 30000, Facturacion_acumulada: 5000, Facturacion_Pendiente: 25000, Progreso: 15, SPI: 0.6, 'Ingeniero Preventa': "Preventa Demo", 'Ejecutivo de Servicio': "Servicio Demo", 'Ejecutivo Comercial': "Comercial Demo", 'Facturación One_Time': { Value: "No" }, Facturador: "Facturación Demo", Created: DateAdd(Now(), -30, TimeUnit.Days) },
        { ID: 6, Title: "Capacitación de usuarios", NumeroCaso: 2006, 'Nombre del proyecto': "Capacitación de usuarios", 'Nombre del Cliente': "Empresa Demo", Descripción: "Plan de capacitación en la nueva plataforma", 'Fecha creación caso aprovisionamiento ': DateAdd(Today(), -200), 'Fecha asignación': DateAdd(Today(), -200), 'Tiempo implementación': 90, 'Fecha firma contrato': DateAdd(Today(), -200), 'Fecha Kick off Cliente': DateAdd(Today(), -200), Fecha_Fin: DateAdd(Today(), -100), 'Caso con pedidos completos': true, Responsable: Filter(UsuariosDemo, Email in ["marta.ruiz@example.com"]), Estado: { Value: "Cancelado" }, Fecha_Completado: Blank(), Segmento: { Value: "Otros" }, Financiación: 20000, Facturacion_acumulada: 8000, Facturacion_Pendiente: 0, Progreso: 40, SPI: 0, 'Ingeniero Preventa': "Preventa Demo", 'Ejecutivo de Servicio': "Servicio Demo", 'Ejecutivo Comercial': "Comercial Demo", 'Facturación One_Time': { Value: "No" }, Facturador: "Facturación Demo", Created: DateAdd(Now(), -200, TimeUnit.Days) }
      );
      ClearCollect(
          Hitos,
        { ID: 1, Title: "Levantamiento de requisitos", 'Nombre del hito': "Levantamiento de requisitos", 'ID proyecto': 1, Descripción: "Entrevistas y documento de alcance", Fecha_Inicio: DateAdd(Today(), -60), Fecha_Fin: DateAdd(Today(), -40), Estado: { Value: "Completado" }, Peso: 20, Avance: 100, Encargado: LookUp(UsuariosDemo, Email = "luis.perez@example.com"), Created: DateAdd(Now(), -60, TimeUnit.Days) },
        { ID: 2, Title: "Diseño de interfaz", 'Nombre del hito': "Diseño de interfaz", 'ID proyecto': 1, Descripción: "Prototipo navegable", Fecha_Inicio: DateAdd(Today(), -40), Fecha_Fin: DateAdd(Today(), 3), Estado: { Value: "En progreso" }, Peso: 30, Avance: 70, Encargado: LookUp(UsuariosDemo, Email = "luis.perez@example.com"), Created: DateAdd(Now(), -59, TimeUnit.Days) },
        { ID: 3, Title: "Desarrollo", 'Nombre del hito': "Desarrollo", 'ID proyecto': 1, Descripción: "Construcción de módulos", Fecha_Inicio: DateAdd(Today(), -10), Fecha_Fin: DateAdd(Today(), 40), Estado: { Value: "Pendiente" }, Peso: 50, Avance: 10, Encargado: LookUp(UsuariosDemo, Email = "ana.gomez@example.com"), Created: DateAdd(Now(), -58, TimeUnit.Days) },
        { ID: 4, Title: "Modelo de datos", 'Nombre del hito': "Modelo de datos", 'ID proyecto': 2, Descripción: "Diseño de tablas de inventario", Fecha_Inicio: DateAdd(Today(), -90), Fecha_Fin: DateAdd(Today(), -60), Estado: { Value: "Completado" }, Peso: 40, Avance: 100, Encargado: LookUp(UsuariosDemo, Email = "marta.ruiz@example.com"), Created: DateAdd(Now(), -90, TimeUnit.Days) },
        { ID: 5, Title: "Pruebas en campo", 'Nombre del hito': "Pruebas en campo", 'ID proyecto': 2, Descripción: "Piloto con usuarios finales", Fecha_Inicio: DateAdd(Today(), -20), Fecha_Fin: DateAdd(Today(), 5), Estado: { Value: "En progreso" }, Peso: 60, Avance: 65, Encargado: LookUp(UsuariosDemo, Email = "marta.ruiz@example.com"), Created: DateAdd(Now(), -89, TimeUnit.Days) },
        { ID: 6, Title: "Extracción", 'Nombre del hito': "Extracción", 'ID proyecto': 3, Descripción: "Extracción de datos históricos", Fecha_Inicio: DateAdd(Today(), -120), Fecha_Fin: DateAdd(Today(), -30), Estado: { Value: "Completado" }, Peso: 50, Avance: 100, Encargado: LookUp(UsuariosDemo, Email = "luis.perez@example.com"), Created: DateAdd(Now(), -120, TimeUnit.Days) },
        { ID: 7, Title: "Validación", 'Nombre del hito': "Validación", 'ID proyecto': 3, Descripción: "Conciliación de registros", Fecha_Inicio: DateAdd(Today(), -30), Fecha_Fin: DateAdd(Today(), -10), Estado: { Value: "En progreso" }, Peso: 50, Avance: 40, Encargado: LookUp(UsuariosDemo, Email = "marta.ruiz@example.com"), Created: DateAdd(Now(), -119, TimeUnit.Days) },
        { ID: 8, Title: "Puesta en marcha", 'Nombre del hito': "Puesta en marcha", 'ID proyecto': 4, Descripción: "Salida a producción", Fecha_Inicio: DateAdd(Today(), -60), Fecha_Fin: DateAdd(Today(), -20), Estado: { Value: "Completado" }, Peso: 100, Avance: 100, Encargado: LookUp(UsuariosDemo, Email = "marta.ruiz@example.com"), Created: DateAdd(Now(), -150, TimeUnit.Days) },
        { ID: 9, Title: "Definición de indicadores", 'Nombre del hito': "Definición de indicadores", 'ID proyecto': 5, Descripción: "Acordar KPIs con el área comercial", Fecha_Inicio: DateAdd(Today(), -30), Fecha_Fin: DateAdd(Today(), 20), Estado: { Value: "Pendiente" }, Peso: 100, Avance: 15, Encargado: LookUp(UsuariosDemo, Email = "luis.perez@example.com"), Created: DateAdd(Now(), -30, TimeUnit.Days) }
      );
      ClearCollect(
          ComentariosProyectos,
          { ID: 1, Title: "Comentario", CreadoPersona: LookUp(UsuariosDemo, Email = "luis.perez@example.com"), 'ID proyecto': 1, Tipo: { Value: "Avance" }, Comentario: "Prototipo aprobado por el cliente.", Created: DateAdd(Now(), -5, TimeUnit.Days) },
          { ID: 2, Title: "Comentario", CreadoPersona: LookUp(UsuariosDemo, Email = "marta.ruiz@example.com"), 'ID proyecto': 3, Tipo: { Value: "Riesgo" }, Comentario: "Hay registros duplicados por depurar.", Created: DateAdd(Now(), -2, TimeUnit.Days) }
      );
      Set(dummie, CurrentUser);
      // ===== CARGA POR ROL (mantener idéntico en App.OnStart y en cmpEncabezado > botón Actualizar) =====
      // Roles, Proyectos e Hitos se descargan EN PARALELO y por lotes dinámicos; se vuelcan a las colecciones finales
      // al terminar (así las pantallas no se recalculan con cada lote). Los comentarios se leen por proyecto al abrirlo.
      // Hitos es la lista más grande: su rango de fechas de creación se parte en 4 tramos que se descargan a la vez.
      // Los cortes salen del primer y el último 'Creado' reales, así que se adaptan solos al volumen de datos.
      Concurrent(
          Set(varHitosDesde, First(Sort(Hitos, Created, SortOrder.Ascending)).Created),
          Set(varHitosHasta, First(Sort(Hitos, Created, SortOrder.Descending)).Created)
      );
      Set(varHitosPaso, RoundUp(DateDiff(varHitosDesde, varHitosHasta, TimeUnit.Seconds) / 4, 0));
      Set(varHitosCorte1, DateAdd(varHitosDesde, varHitosPaso, TimeUnit.Seconds));
      Set(varHitosCorte2, DateAdd(varHitosDesde, 2 * varHitosPaso, TimeUnit.Seconds));
      Set(varHitosCorte3, DateAdd(varHitosDesde, 3 * varHitosPaso, TimeUnit.Seconds));
      Concurrent(
          With({},
          // Lista Roles → colTmpRoles por lotes dinámicos (paginación por cursor sobre 'Creado', que sí es delegable en la fuente de datos;
          // la columna ID solo admite "=" y no sirve para rangos). Cada vuelta pide las siguientes TamanoLote filas creadas
          // desde la última ya descargada; se detiene sola cuando un lote llega incompleto. 200 vueltas = hasta 400.000 filas.
          Clear(colTmpRoles);
          ClearCollect(colFinRoles, { Fin: false });
          ForAll(
              Sequence(200),
              If(
                  !First(colFinRoles).Fin,
                  With(
                      { _ultimo: Max(colTmpRoles, Created) },
                      With(
                          {
                              _lote: If(
                                  IsBlank(_ultimo),
                                  Sort(Roles, Created, SortOrder.Ascending),
                                  Sort(Filter(Roles, Created >= _ultimo), Created, SortOrder.Ascending)
                              )
                          },
                          With(
                              // Filas con la misma fecha que el cursor pueden venir repetidas: solo se añaden las nuevas
                              { _nuevos: Filter(_lote, IsBlank(_ultimo) || Created > _ultimo || !(ID in Filter(colTmpRoles, Created = _ultimo).ID)) },
                              Collect(colTmpRoles, _nuevos);
                              If(
                                  CountRows(_lote) < TamanoLote || IsEmpty(_nuevos),
                                  Patch(colFinRoles, First(colFinRoles), { Fin: true })
                              )
                          )
                      )
                  )
              )
          )
      ),
          With({},
          // Lista Proyectos → colTmpProyectos por lotes dinámicos (misma paginación por cursor sobre 'Creado')
          Clear(colTmpProyectos);
          ClearCollect(colFinProyectos, { Fin: false });
          ForAll(
              Sequence(200),
              If(
                  !First(colFinProyectos).Fin,
                  With(
                      { _ultimo: Max(colTmpProyectos, Created) },
                      With(
                          {
                              _lote: If(
                                  IsBlank(_ultimo),
                                  Sort(Proyectos, Created, SortOrder.Ascending),
                                  Sort(Filter(Proyectos, Created >= _ultimo), Created, SortOrder.Ascending)
                              )
                          },
                          With(
                              { _nuevos: Filter(_lote, IsBlank(_ultimo) || Created > _ultimo || !(ID in Filter(colTmpProyectos, Created = _ultimo).ID)) },
                              Collect(colTmpProyectos, _nuevos);
                              If(
                                  CountRows(_lote) < TamanoLote || IsEmpty(_nuevos),
                                  Patch(colFinProyectos, First(colFinProyectos), { Fin: true })
                              )
                          )
                      )
                  )
              )
          )
      ),
          With({},
          // Hitos, tramo 1 de 4: [primer Creado, corte 1)
          Clear(colTmpHitos1);
          ClearCollect(colFinHitos1, { Fin: IsBlank(varHitosDesde) });
          ForAll(
              Sequence(200),
              If(
                  !First(colFinHitos1).Fin,
                  With(
                      { _ultimo: Max(colTmpHitos1, Created) },
                      With(
                          { _lote: Sort(Filter(Hitos, Created >= Coalesce(_ultimo, varHitosDesde), Created < varHitosCorte1), Created, SortOrder.Ascending) },
                          With(
                              { _nuevos: Filter(_lote, IsBlank(_ultimo) || Created > _ultimo || !(ID in Filter(colTmpHitos1, Created = _ultimo).ID)) },
                              Collect(colTmpHitos1, _nuevos);
                              If(
                                  CountRows(_lote) < TamanoLote || IsEmpty(_nuevos),
                                  Patch(colFinHitos1, First(colFinHitos1), { Fin: true })
                              )
                          )
                      )
                  )
              )
          )
      ),
          With({},
          // Hitos, tramo 2 de 4: [corte 1, corte 2)
          Clear(colTmpHitos2);
          ClearCollect(colFinHitos2, { Fin: IsBlank(varHitosDesde) });
          ForAll(
              Sequence(200),
              If(
                  !First(colFinHitos2).Fin,
                  With(
                      { _ultimo: Max(colTmpHitos2, Created) },
                      With(
                          { _lote: Sort(Filter(Hitos, Created >= Coalesce(_ultimo, varHitosCorte1), Created < varHitosCorte2), Created, SortOrder.Ascending) },
                          With(
                              { _nuevos: Filter(_lote, IsBlank(_ultimo) || Created > _ultimo || !(ID in Filter(colTmpHitos2, Created = _ultimo).ID)) },
                              Collect(colTmpHitos2, _nuevos);
                              If(
                                  CountRows(_lote) < TamanoLote || IsEmpty(_nuevos),
                                  Patch(colFinHitos2, First(colFinHitos2), { Fin: true })
                              )
                          )
                      )
                  )
              )
          )
      ),
          With({},
          // Hitos, tramo 3 de 4: [corte 2, corte 3)
          Clear(colTmpHitos3);
          ClearCollect(colFinHitos3, { Fin: IsBlank(varHitosDesde) });
          ForAll(
              Sequence(200),
              If(
                  !First(colFinHitos3).Fin,
                  With(
                      { _ultimo: Max(colTmpHitos3, Created) },
                      With(
                          { _lote: Sort(Filter(Hitos, Created >= Coalesce(_ultimo, varHitosCorte2), Created < varHitosCorte3), Created, SortOrder.Ascending) },
                          With(
                              { _nuevos: Filter(_lote, IsBlank(_ultimo) || Created > _ultimo || !(ID in Filter(colTmpHitos3, Created = _ultimo).ID)) },
                              Collect(colTmpHitos3, _nuevos);
                              If(
                                  CountRows(_lote) < TamanoLote || IsEmpty(_nuevos),
                                  Patch(colFinHitos3, First(colFinHitos3), { Fin: true })
                              )
                          )
                      )
                  )
              )
          )
      ),
          With({},
          // Hitos, tramo 4 de 4: desde el corte 3 sin límite superior (incluye lo creado mientras se carga)
          Clear(colTmpHitos4);
          ClearCollect(colFinHitos4, { Fin: IsBlank(varHitosDesde) });
          ForAll(
              Sequence(200),
              If(
                  !First(colFinHitos4).Fin,
                  With(
                      { _ultimo: Max(colTmpHitos4, Created) },
                      With(
                          { _lote: Sort(Filter(Hitos, Created >= Coalesce(_ultimo, varHitosCorte3)), Created, SortOrder.Ascending) },
                          With(
                              { _nuevos: Filter(_lote, IsBlank(_ultimo) || Created > _ultimo || !(ID in Filter(colTmpHitos4, Created = _ultimo).ID)) },
                              Collect(colTmpHitos4, _nuevos);
                              If(
                                  CountRows(_lote) < TamanoLote || IsEmpty(_nuevos),
                                  Patch(colFinHitos4, First(colFinHitos4), { Fin: true })
                              )
                          )
                      )
                  )
              )
          )
      )
      );
      ClearCollect(colTmpHitos, colTmpHitos1, colTmpHitos2, colTmpHitos3, colTmpHitos4);
      Clear(colTmpHitos1);
      Clear(colTmpHitos2);
      Clear(colTmpHitos3);
      Clear(colTmpHitos4);
      ClearCollect(ColRoles, colTmpRoles);
      Set(UserRole, LookUp(ColRoles, Nombre.Email = dummie.Mail).Rol);
      Set(varAccesoTotal, UserRole.Value in ["Supervisor", "Gerente", "Lider funcional"]);
      If(
          varAccesoTotal,
          // Supervisor, Gerente y Lider funcional → todo
          ClearCollect(ColProyectos, colTmpProyectos);
          ClearCollect(ColHitos, colTmpHitos),
          UserRole.Value = "PM",
          // PM → sus proyectos; todos los hitos de esos proyectos (para el avance) + los hitos que tenga asignados en otros
          ClearCollect(ColProyectos, Filter(colTmpProyectos, dummie.Mail in Responsable.Email));
          ClearCollect(ColHitos, Filter(colTmpHitos, 'ID proyecto' in ColProyectos.ID || Encargado.Email = dummie.Mail)),
          // Otros → NO cargar nada
          Clear(ColProyectos);
          Clear(ColHitos)
      );
      Clear(colTmpRoles);
      Clear(colTmpProyectos);
      Clear(colTmpHitos);
      // ===== FIN CARGA POR ROL =====
      Set(VarMenu, false);
      Set(
          Supervisor,
          LookUp(ColRoles, Nombre.Email = CurrentUser.Mail).Supervisor.Email
      );
      Set(varVista, "Tablero");
      Set(varVista1, "Mes");
      Set(varHoy, Today());
      Set(VarDiaActual, Date(Year(Today()), Month(Today()), 1));
      Set(VarMesActual, Date(Year(Today()), Month(Today()), 1));
      // Desplazamientos del cronograma: las colecciones se construyen en scrCronogramaProyectos (btnRecalcularCronogramaProyectos)
      Set(varSemanaOffset, 0);
      Set(varMesOffset, 0);
      // Fotos de perfil: se consultan UNA vez por persona (no por fila de galería) y las galerías las leen de colFotos.
      // Va al final para no retrasar los datos; mientras llega, o si la persona no tiene foto, se ve el avatar con iniciales.
      ClearCollect(
          colCorreos,
          ForAll(Distinct(ColHitos, Lower(Encargado.Email)), { Mail: Value }),
          ForAll(Distinct(Ungroup(ForAll(ColProyectos, { R: Responsable }), R), Lower(Email)), { Mail: Value })
      );
      Clear(colFotos);
      ForAll(
          Distinct(Filter(colCorreos, !IsBlank(Mail)), Mail) As m,
          If(
              false,
              Collect(colFotos, { Mail: m.Value, Foto: SampleImage })
          )
      );
      Clear(colCorreos)
    SizeBreakpoints: =[600, 900, 1200]
    StartScreen: =scrInicio
    Theme: =PowerAppsTheme
