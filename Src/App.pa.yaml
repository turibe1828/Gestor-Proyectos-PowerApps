App:
  Properties:
    Formulas: "=// MODO DEMO: no hay conexión a Office 365; el usuario actual es ficticio\r\nCurrentUser = { DisplayName: \"Ana Gómez\", GivenName: \"Ana\", Mail: \"ana.gomez@example.com\", Department: \"Oficina de Proyectos\", JobTitle: \"Gerente de proyectos\" };\r\n// Foto del usuario: se pide una sola vez y la reutilizan todas las instancias de cmpEncabezado\r\nFotoUsuario = // Foto de Office 365 si la tiene; si no, avatar con iniciales; si no hay nombre, SampleImage\r\nIf(\r\n    !IsBlank(CurrentUser.Mail) && false,\r\n    SampleImage,\r\n    // Avatar: círculo SVG con las iniciales y un color estable por persona; sin nombre → SampleImage\r\nWith(\r\n    { _partes: Split(Trim(Coalesce(CurrentUser.DisplayName, \"\")), \" \") },\r\n    With(\r\n        { _ini: Upper(Left(First(_partes).Value, 1) & If(CountRows(_partes) > 1, Left(Last(_partes).Value, 1), \"\")) },\r\n        If(\r\n            IsBlank(_ini),\r\n            SampleImage,\r\n            \"data:image/svg+xml;utf8,\" & EncodeUrl(\r\n                \"<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><circle cx='40' cy='40' r='40' fill='\" &\r\n                Index(\r\n                    [\"#2563EB\", \"#0E9F6E\", \"#D97706\", \"#7C3AED\", \"#DB2777\", \"#0891B2\"],\r\n                    Mod(Coalesce(Find(Left(_ini, 1), \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"), 0) + Len(CurrentUser.DisplayName), 6) + 1\r\n                ).Value &\r\n                \"'/><text x='40' y='40' dy='0.35em' text-anchor='middle' font-family='Segoe UI, Arial, sans-serif' font-size='30' font-weight='600' fill='#FFFFFF'>\" &\r\n                _ini & \"</text></svg>\"\r\n            )\r\n        )\r\n    )\r\n)\r\n);\r\n// Tamaño de lote de la carga de listas: debe ser igual al límite de filas de la app (Configuración > Límite de filas de datos = 2000)\r\nTamanoLote = 2000;\r\n// Resumen de hitos por proyecto (pesos y conteos). Al ser fórmula con nombre se recalcula sola UNA vez cada vez que cambia ColHitos;\r\n// las tarjetas de proyecto lo consultan con LookUp en vez de recorrer todos los hitos (antes: proyectos × hitos operaciones)\r\nResumenHitosProyecto = AddColumns(\r\n    GroupBy(ColHitos, 'ID proyecto', _hitos),\r\n    PesoTotal, Sum(_hitos, Coalesce(Peso, 0)),\r\n    PesoHecho, Sum(_hitos, Coalesce(Peso, 0) * Coalesce(Avance, 0) / 100),\r\n    NumHitos, CountRows(_hitos),\r\n    NumCompletados, CountIf(_hitos, Estado.Value = \"Completado\")\r\n);\r\nMyTheme =\r\n{\r\n    Primary: ColorValue(\"#0F766E\"),\r\n    LightBlue: ColorValue(\"#5EEAD4\"),\r\n    DarkBlue: ColorValue(\"#134E4A\"),\r\n    Gray: ColorValue(\"#64748B\"),\r\n    LightGray: ColorValue(\"#F1F5F9\"),\r\n    Green: ColorValue(\"#BBF7D0\"),\r\n    Orange: ColorValue(\"#FED7AA\"),\r\n    Yellow: ColorValue(\"#F59E0B\"),\r\n\r\n    PrimaryText:(\"#0F766E\"),\r\n    LightBluetext:(\"#5EEAD4\"),\r\n    DarkBlueText:(\"#134E4A\"),\r\n    GrayText:(\"#64748B\"),\r\n    LightGrayText:(\"#F1F5F9\")\r\n};\r\n\r\nMyIcons =\r\n{\r\n    Inicio: \"<svg xmlns='http://www.w3.org/2000/svg' id='Layer_1' data-name='Layer 1' viewBox='0 0 24 24' width='40px' height='40px'><path fill='currentColor' d='M22,5.724V1.987c0-.553-.447-1-1-1s-1,.447-1,1v2.379L14.797,.855c-1.699-1.146-3.895-1.146-5.594,0L2.204,5.579c-1.38,.93-2.204,2.479-2.204,4.145v9.276c0,2.757,2.243,5,5,5h14c2.757,0,5-2.243,5-5V9.724c0-1.581-.744-3.058-2-3.999Zm0,13.276c0,1.654-1.346,3-3,3H5c-1.654,0-3-1.346-3-3V9.724c0-.999,.494-1.929,1.322-2.486L10.322,2.514c.51-.345,1.094-.517,1.678-.517s1.168,.172,1.678,.517l7.001,4.724c.827,.558,1.321,1.487,1.321,2.486v9.276Z'/></svg>\",\r\n    InicioFill: \"<svg xmlns='http://www.w3.org/2000/svg' id='Layer_1' data-name='Layer 1' viewBox='0 0 24 24' width='40px' height='40px'><path fill='currentColor' d='M22,5.735V1.987c0-.553-.447-1-1-1s-1,.447-1,1v2.379L14.797,.855c-1.699-1.146-3.895-1.146-5.594,0L2.204,5.579c-1.38,.93-2.204,2.479-2.204,4.145v9.276c0,2.757,2.243,5,5,5h14c2.757,0,5-2.243,5-5V9.724c0-1.579-.748-3.047-2-3.989Z'/></svg>\",\r\n    Folder: \"<svg xmlns='http://www.w3.org/2000/svg' id='Outline' viewBox='0 0 24 24' width='40px' height='40px'><path fill='currentColor' d='M19,3H12.472a1.019,1.019,0,0,1-.447-.1L8.869,1.316A3.014,3.014,0,0,0,7.528,1H5A5.006,5.006,0,0,0,0,6V18a5.006,5.006,0,0,0,5,5H19a5.006,5.006,0,0,0,5-5V8A5.006,5.006,0,0,0,19,3ZM5,3H7.528a1.019,1.019,0,0,1,.447.1l3.156,1.579A3.014,3.014,0,0,0,12.472,5H19a3,3,0,0,1,2.779,1.882L2,6.994V6A3,3,0,0,1,5,3ZM19,21H5a3,3,0,0,1-3-3V8.994l20-.113V18A3,3,0,0,1,19,21Z'/></svg>\",\r\n    FolderFill: \"<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' version='1.1' id='Capa_1' x='0px' y='0px' viewBox='0 0 512 512' style='enable-background:new 0 0 512 512;' xml:space='preserve' width='40px' height='40px'><g>\r\n    <path fill='currentColor' d='M0,191.808V384c0.071,58.881,47.786,106.596,106.667,106.667h298.667C464.214,490.596,511.93,442.881,512,384V189.44   L0,191.808z'/>\r\n    <path fill='currentColor' d='M405.333,64H266.069c-3.299,0.022-6.56-0.708-9.536-2.133l-67.328-33.792c-8.888-4.426-18.679-6.733-28.608-6.741h-53.931   C47.786,21.404,0.071,69.119,0,128v21.141l509.077-2.368C497.961,98.408,454.959,64.099,405.333,64z'/></g></svg>\",\r\n    List: \"<svg xmlns='http://www.w3.org/2000/svg' id='Layer_1' data-name='Layer 1' viewBox='0 0 24 24'><path fill='currentColor' d='m19,1H5C2.243,1,0,3.243,0,6v12c0,2.757,2.243,5,5,5h14c2.757,0,5-2.243,5-5V6c0-2.757-2.243-5-5-5Zm3,17c0,1.654-1.346,3-3,3H5c-1.654,0-3-1.346-3-3V6c0-1.654,1.346-3,3-3h14c1.654,0,3,1.346,3,3v12Zm-3-11c0,.552-.448,1-1,1h-7c-.552,0-1-.448-1-1s.448-1,1-1h7c.552,0,1,.448,1,1Zm-11,0c0,.828-.672,1.5-1.5,1.5s-1.5-.672-1.5-1.5.672-1.5,1.5-1.5,1.5.672,1.5,1.5Zm11,5c0,.552-.448,1-1,1h-7c-.552,0-1-.448-1-1s.448-1,1-1h7c.552,0,1,.448,1,1Zm-11,0c0,.828-.672,1.5-1.5,1.5s-1.5-.672-1.5-1.5.672-1.5,1.5-1.5,1.5.672,1.5,1.5Zm11,5c0,.552-.448,1-1,1h-7c-.552,0-1-.448-1-1s.448-1,1-1h7c.552,0,1,.448,1,1Zm-11,0c0,.828-.672,1.5-1.5,1.5s-1.5-.672-1.5-1.5.672-1.5,1.5-1.5,1.5.672,1.5,1.5Z'/></svg>\",\r\n    ListFill: \"<svg xmlns='http://www.w3.org/2000/svg' id='Layer_1' data-name='Layer 1' viewBox='0 0 24 24'><path fill='currentColor' d='m19,1H5C2.243,1,0,3.243,0,6v12c0,2.757,2.243,5,5,5h14c2.757,0,5-2.243,5-5V6c0-2.757-2.243-5-5-5ZM6.5,18.5c-.828,0-1.5-.672-1.5-1.5s.672-1.5,1.5-1.5,1.5.672,1.5,1.5-.672,1.5-1.5,1.5Zm0-5c-.828,0-1.5-.672-1.5-1.5s.672-1.5,1.5-1.5,1.5.672,1.5,1.5-.672,1.5-1.5,1.5Zm0-5c-.828,0-1.5-.672-1.5-1.5s.672-1.5,1.5-1.5,1.5.672,1.5,1.5-.672,1.5-1.5,1.5Zm11.5,9.5h-7c-.552,0-1-.448-1-1s.448-1,1-1h7c.552,0,1,.448,1,1s-.448,1-1,1Zm0-5h-7c-.552,0-1-.448-1-1s.448-1,1-1h7c.552,0,1,.448,1,1s-.448,1-1,1Zm0-5h-7c-.552,0-1-.448-1-1s.448-1,1-1h7c.552,0,1,.448,1,1s-.448,1-1,1Z'/></svg>\",\r\n    Menu: \"<svg xmlns='http://www.w3.org/2000/svg' width='1em' height='1em' viewBox='0 0 24 24'><path fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M5 17h14M5 12h14M5 7h14'/></svg>\",\r\n    Cronograma: \"<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' id='Calendar_24' width='40px' height='40px' viewBox='0 0 24 24'><rect width='24' height='24' stroke='none' fill='#000000' opacity='0'/><g transform='matrix(1 0 0 1 12 12)'><path style='stroke: none; stroke-width: 1; stroke-dasharray: none; stroke-linecap: butt; stroke-dashoffset: 0; stroke-linejoin: miter; stroke-miterlimit: 4; fill: currentColor; fill-rule: nonzero; opacity: 1;' transform=' translate(-16, -15.5)' d='M 9 4 L 9 5 L 5 5 L 5 27 L 27 27 L 27 5 L 23 5 L 23 4 L 21 4 L 21 5 L 11 5 L 11 4 Z M 7 7 L 9 7 L 9 8 L 11 8 L 11 7 L 21 7 L 21 8 L 23 8 L 23 7 L 25 7 L 25 9 L 7 9 Z M 7 11 L 25 11 L 25 25 L 7 25 Z M 13 13 L 13 15 L 15 15 L 15 13 Z M 17 13 L 17 15 L 19 15 L 19 13 Z M 21 13 L 21 15 L 23 15 L 23 13 Z M 9 17 L 9 19 L 11 19 L 11 17 Z M 13 17 L 13 19 L 15 19 L 15 17 Z M 17 17 L 17 19 L 19 19 L 19 17 Z M 21 17 L 21 19 L 23 19 L 23 17 Z M 9 21 L 9 23 L 11 23 L 11 21 Z M 13 21 L 13 23 L 15 23 L 15 21 Z M 17 21 L 17 23 L 19 23 L 19 21 Z' stroke-linecap='round'/></g></svg>\",\r\n    CronogramaFill: \"<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' id='Calendar_24' width='40px' height='40px' viewBox='0 0 24 24'><rect width='24' height='24' stroke='none' fill='#000000' opacity='0'/><g transform='matrix(1 0 0 1 12 12)'><path style='stroke: none; stroke-width: 1; stroke-dasharray: none; stroke-linecap: butt; stroke-dashoffset: 0; stroke-linejoin: miter; stroke-miterlimit: 4; fill: currentColor; fill-rule: nonzero; opacity: 1;' transform=' translate(-16, -15.5)' d='M 9 4 L 9 5 L 5 5 L 5 27 L 27 27 L 27 5 L 23 5 L 23 4 L 21 4 L 21 5 L 11 5 L 11 4 Z M 7 7 L 9 7 L 9 8 L 11 8 L 11 7 L 21 7 L 21 8 L 23 8 L 23 7 L 25 7 L 25 9 L 7 9 Z M 7 11 L 25 11 L 25 25 L 7 25 Z M 13 13 L 13 15 L 15 15 L 15 13 Z M 17 13 L 17 15 L 19 15 L 19 13 Z M 21 13 L 21 15 L 23 15 L 23 13 Z M 9 17 L 9 19 L 11 19 L 11 17 Z M 13 17 L 13 19 L 15 19 L 15 17 Z M 17 17 L 17 19 L 19 19 L 19 17 Z M 21 17 L 21 19 L 23 19 L 23 17 Z M 9 21 L 9 23 L 11 23 L 11 21 Z M 13 21 L 13 23 L 15 23 L 15 21 Z M 17 21 L 17 23 L 19 23 L 19 21 Z' stroke-linecap='round'/></g></svg>\",\r\n    powerBi: \"<svg xmlns='http://www.w3.org/2000/svg' width='40px' height='40px' viewBox='0 0 24 24'>\r\n    <rect width='24' height='24' fill='none'/>\r\n    <g transform='matrix(0.6 0 0 0.5 12 12)'>\r\n        <path style='stroke: none; fill: currentColor; fill-rule: nonzero; opacity: 1;' \r\n        transform='translate(-25.5, -25)' \r\n        d='M 42 1 L 29 1 C 27.897 1 27 1.897 27 3 L 27 12 L 18 12 \r\n            C 16.897 12 16 12.897 16 14 L 16 22 L 9 22 \r\n            C 7.897 22 7 22.897 7 24 L 7 47 C 7 48.103 7.897 49 9 49 \r\n            L 18 49 L 22 49 L 29 49 L 31 49 L 42 49 \r\n            C 43.103 49 44 48.103 44 47 L 44 3 C 44 1.897 43.103 1 42 1 z \r\n            M 9 24 L 22 24 L 21.999 47 L 9 47 L 9 24 z \r\n            M 22 22 L 18 22 L 18 14 L 31 14 L 30.999 47 L 24 47 L 24 24 \r\n            C 24 22.897 23.103 22 22 22 z \r\n            M 41.999 47 L 33 47 L 33 14 C 33 12.897 32.103 12 31 12 \r\n            L 29 12 L 29 3 L 42 3 L 41.999 47 z' />\r\n    </g>\r\n    </svg>\",\r\n      powerBiFill:\"<svg xmlns='http://www.w3.org/2000/svg' width='40px' height='40px' viewBox='0 0 24 24'>\r\n        <rect width='24' height='24' fill='none'/>\r\n        <g transform='matrix(0.6 0 0 0.5 12 12)'>\r\n            <path style='stroke: none; fill: currentColor; fill-rule: nonzero; opacity: 1;' \r\n            transform='translate(-25.5, -25)' \r\n            d='M 42 1 L 29 1 C 27.897 1 27 1.897 27 3 L 27 12 L 18 12 \r\n                C 16.897 12 16 12.897 16 14 L 16 22 L 9 22 \r\n                C 7.897 22 7 22.897 7 24 L 7 47 C 7 48.103 7.897 49 9 49 \r\n                L 18 49 L 22 49 L 29 49 L 31 49 L 42 49 \r\n                C 43.103 49 44 48.103 44 47 L 44 3 C 44 1.897 43.103 1 42 1 z' />\r\n        </g>\r\n        </svg>\",\r\n        aprobacion: \"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='40px' height='40px'>\r\n        <path fill='currentColor' d='M11.383 1.902c-.293-.293-.768-.293-1.061 0-.293.293-.293.768 0 1.061l1.457 1.457C6.778 4.454 2.986 8.277 2.986 13c0 5.239 4.261 9.5 9.5 9.5 5.163 0 9.366-4.125 9.496-9.27.01-.414-.318-.759-.732-.769-.414-.01-.759.318-.769.732C20.37 17.524 16.834 21 12.486 21c-4.411 0-8-3.589-8-8 0-4.397 3.567-7.973 7.959-7.995L10.32 6.63c-.293.293-.293.768 0 1.061.293.293.768.293 1.061 0l2.4-2.4c.293-.293.293-.768 0-1.061l-2.398-2.398z'/>\r\n        <path fill='currentColor' d='M15.424 10.32c.293.293.293.768 0 1.061l-4.2 4.199c-.293.293-.768.293-1.061 0l-1.8-1.8c-.293-.293-.293-.768 0-1.061.293-.293.768-.293 1.061 0l1.269 1.269 3.669-3.668c.293-.293.768-.293 1.061 0z'/>\r\n        </svg>\",\r\n        aprobacionfill: \"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='40px' height='40px'><circle cx='12' cy='12' r='10' fill='currentColor'/><path fill='none' stroke='#FFFFFF' stroke-width='2' stroke-linecap='round' d='M8 12.5l2.7 2.7L16 10'/></svg>\"\r\n\r\n\r\n};\r\n\r\nMenuItems=\r\n[\r\n    {ID:1,\r\n    Name:\"Inicio\",\r\n    Icon:MyIcons.Inicio,\r\n    IconFill:MyIcons.InicioFill,\r\n    Screen:scrInicio\r\n    },\r\n\r\n     {ID:2,\r\n    Name:\"Proyectos\",\r\n    Icon:MyIcons.Folder,\r\n    IconFill:MyIcons.FolderFill,\r\n    Screen:scrMisProyectos\r\n    },  \r\n    \r\n    {ID:3,\r\n    Name:\"Hitos\",\r\n    Icon:MyIcons.List,\r\n    IconFill:MyIcons.ListFill,\r\n    Screen:scrMisHitos\r\n    },\r\n\r\n    {ID:4,\r\n    Name: \"Cronograma\",\r\n    Icon: MyIcons.Cronograma,\r\n    IconFill:MyIcons.CronogramaFill,\r\n    Screen:scrCronogramaProyectos}\r\n];\r\n\r\n// ===== Tokens de diseño (responsive): tamaños de fuente, espaciados y colores repetidos =====\r\n// Puntos de quiebre en App.SizeBreakpoints = [600, 900, 1200] -> ScreenSize.Small (celular), Medium (tablet), Large y ExtraLarge (escritorio)\r\nFuente = { Mini: 8, Pequena: 10, Etiqueta: 11, Normal: 12, Destacada: 13, Media: 14, Subtitulo: 15, Titulo: 19 };\r\nEspacio = { XS: 5, S: 8, M: 10, L: 20, XL: 30 };\r\nColores = { Texto: RGBA(50, 49, 48, 1), Error: RGBA(168, 0, 0, 1), Blanco: RGBA(255, 255, 255, 1), FondoSuave: RGBA(245, 245, 245, 1), Velo: RGBA(0, 0, 0, 0.1), VeloSuave: RGBA(0, 0, 0, 0.05) };\r\n\r\n// ===== MODO DEMO: catálogos y usuarios ficticios (reemplazan Choices() y el directorio) =====\r\nUsuariosDemo = Table(\r\n    { '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\", Claims: \"i:0#.f|membership|ana.gomez@example.com\", DisplayName: \"Ana Gómez\", Email: \"ana.gomez@example.com\", Department: \"Oficina de Proyectos\", JobTitle: \"Gerente de proyectos\", Picture: \"\" },\r\n    { '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\", Claims: \"i:0#.f|membership|luis.perez@example.com\", DisplayName: \"Luis Pérez\", Email: \"luis.perez@example.com\", Department: \"Oficina de Proyectos\", JobTitle: \"Project manager\", Picture: \"\" },\r\n    { '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\", Claims: \"i:0#.f|membership|marta.ruiz@example.com\", DisplayName: \"Marta Ruiz\", Email: \"marta.ruiz@example.com\", Department: \"Oficina de Proyectos\", JobTitle: \"Project manager\", Picture: \"\" },\r\n    { '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\", Claims: \"i:0#.f|membership|carlos.diaz@example.com\", DisplayName: \"Carlos Díaz\", Email: \"carlos.diaz@example.com\", Department: \"Dirección\", JobTitle: \"Supervisor\", Picture: \"\" }\r\n);\r\nEstadosProyecto = Table({ Value: \"En progreso\" }, { Value: \"Completado\" }, { Value: \"Stand By\" }, { Value: \"Cancelado\" });\r\nEstadosHito = Table({ Value: \"Pendiente\" }, { Value: \"En progreso\" }, { Value: \"Completado\" }, { Value: \"Cancelado\" });\r\nSegmentosDemo = Table({ Value: \"Software\" }, { Value: \"Servicios\" }, { Value: \"Otros\" });\r\nOpcionesFacturacionUnica = Table({ Value: \"Si\" }, { Value: \"No\" });\r\nTiposComentario = Table({ Value: \"General\" }, { Value: \"Avance\" }, { Value: \"Riesgo\" });\r\n// Casos de ejemplo que devuelve la consulta simulada del botón Consultar (en la versión real la hace un flujo)\r\nCasosDemo = Table(\r\n    { caso: \"1001\", respuesta: \"false\", nombrecliente: \"Cliente Ejemplo S.A.\", pm: \"Luis Pérez\", propietario_caso_preventa: \"Preventa Demo\", ejecutivo_comercial: \"Comercial Demo\", ejecutivo_servicio: \"Servicio Demo\", facturador: \"Facturación Demo\", facturaciontotal: 120000, facturacionactual: 30000, fecha_firma_contrato: Date(2026, 1, 15), fecha_creacion_caso: Date(2026, 1, 20), pedidos: \"True\", one_time: \"False\", segmento: \"Software\", hito: \"Kick-off del proyecto\" },\r\n    { caso: \"1002\", respuesta: \"false\", nombrecliente: \"Comercial Demo Ltda.\", pm: \"Marta Ruiz\", propietario_caso_preventa: \"Preventa Demo\", ejecutivo_comercial: \"Comercial Demo\", ejecutivo_servicio: \"Servicio Demo\", facturador: \"Facturación Demo\", facturaciontotal: 80000, facturacionactual: 0, fecha_firma_contrato: Date(2026, 3, 2), fecha_creacion_caso: Date(2026, 3, 5), pedidos: \"False\", one_time: \"True\", segmento: \"Servicios\", hito: \"\" }\r\n);\r\n// Imágenes neutras (SVG) en lugar de los recursos gráficos originales\r\nImagenBanner = \"data:image/svg+xml;utf8,\" & EncodeUrl(\"<svg xmlns='http://www.w3.org/2000/svg' width='800' height='160' viewBox='0 0 800 160'><rect width='800' height='160' rx='24' fill='#134E4A'/><text x='400' y='95' text-anchor='middle' font-family='Segoe UI, Arial' font-size='44' font-weight='600' fill='#FFFFFF'>Gestor de Proyectos Demo</text></svg>\");\r\nImagenLogo = \"data:image/svg+xml;utf8,\" & EncodeUrl(\"<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='#0F766E'/><text x='32' y='41' text-anchor='middle' font-family='Segoe UI, Arial' font-size='26' font-weight='700' fill='#FFFFFF'>GP</text></svg>\");\r\nImagenActualizar = \"data:image/svg+xml;utf8,\" & EncodeUrl(\"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='#0F766E' stroke-width='2' stroke-linecap='round' d='M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5'/></svg>\");\r\nImagenCargando = \"data:image/svg+xml;utf8,\" & EncodeUrl(\"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='#0F766E' d='M6 2h8l4 4v16H6z'/><path fill='#FFFFFF' d='M9 11h6v1.5H9zm0 3h6v1.5H9z'/></svg>\");\r\nImagenError = \"data:image/svg+xml;utf8,\" & EncodeUrl(\"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='#DC2626'/><path stroke='#FFFFFF' stroke-width='2.5' stroke-linecap='round' d='M8 8l8 8M16 8l-8 8'/></svg>\");\r\nImagenExito = \"data:image/svg+xml;utf8,\" & EncodeUrl(\"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='#16A34A'/><path fill='none' stroke='#FFFFFF' stroke-width='2.5' stroke-linecap='round' d='M7 12.5l3.2 3.2L17 9'/></svg>\");"
    OnStart: |-
      =// ===== MODO DEMO: datos ficticios =====
