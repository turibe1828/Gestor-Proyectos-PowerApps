                      Variant: ClassicNumberEdit
                      Properties:
                        BorderColor: =Colores.FondoSuave
                        DataField: ="Peso"
                        Default: =Coalesce(ThisItem.Peso, 0)
                        DisplayMode: =DisplayMode.Edit
                        DisplayName: ="Peso"
                        Required: =true
                        Update: =Value(txtPesoHito.Text)
                        Width: =If(Parent.Width/2 < 400, Parent.Width, Parent.Width/2)
                        X: =1
                        Y: =4
                      Children:
                        - lblPesoHitoTitulo:
                            Control: Label@2.5.1
                            MetadataKey: FieldName
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =Color.Black
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              PaddingLeft: =0
                              Text: =Parent.DisplayName
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =10
                        - txtPesoHito:
                            Control: Classic/TextInput@2.3.2
                            MetadataKey: FieldValue
                            Properties:
                              BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                              Color: =Colores.Texto
                              Default: =Parent.Default
                              DelayOutput: =true
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisabledFill: =RGBA(242, 242, 241, 0)
                              DisplayMode: =Parent.DisplayMode
                              Font: =Font.Lato
                              FontWeight: =FontWeight.Lighter
                              Format: =TextFormat.Number
                              HintText: ="Ingresa el % de peso que representa el hito"
                              HoverBorderColor: =RGBA(16, 110, 190, 1)
                              HoverColor: =RGBA(50, 49, 48, 1)
                              HoverFill: =RGBA(255, 255, 255, 1)
                              OnChange: |-
                                =// Si venimos de un Reset, ignoramos solo esta ejecución (evita notificaciones y recálculo indeseados)
                                If(
                                    Coalesce(varSkipRecalc, false),
                                    Set(varSkipRecalc, false);
                                    Blank(),
                                    With(
                                        {
                                            // Proyecto elegido en el formulario (o el del hito / el de origen)
                                            proyectoId: Coalesce(cmbProyectoHito.Selected.ID, ThisItem.'ID proyecto', varProyecto.ID),
                                            idActual: ThisItem.ID,
                                            // SOLO usamos el valor del mismo control que cambió
                                            valor19: Coalesce(Value(Self.Text), 0)
                                        },
                                        // Una sola consulta a la fuente de datos con los hitos del proyecto
                                        With(
                                            { _hitos: Filter(Hitos, 'ID proyecto' = proyectoId) },
                                            // Total = pesos del proyecto - peso GUARDADO de este hito + el valor que se está escribiendo
                                            Set(
                                                varTotalPeso,
                                                Round(
                                                    Sum(_hitos, Coalesce(Peso, 0))
                                                    - If(IsBlank(idActual), 0, Coalesce(LookUp(_hitos, ID = idActual, Peso), 0))
                                                    + valor19,
                                                    2
                                                )
                                            )
                                        );
                                        Set(varErrorPeso, varTotalPeso > 100);

                                        // Notificaciones
                                        If(
                                            varTotalPeso > 100,
                                            Notify(
                                                "Te excediste por " & Text(varTotalPeso - 100, "[$-es-ES]0%") &
                                                ". Peso actual del hito: " & Text(valor19, "[$-es-ES]0%"),
                                                NotificationType.Error,2000
                                            );
                                            // Ignorar SOLO la siguiente ejecución (la que dispara el Reset)
                                            Set(varSkipRecalc, true);
                                            Reset(Self),
                                            varTotalPeso < 100,
                                            Notify(
                                                "Te faltan " & Text(100 - varTotalPeso, "[$-es-ES]0%") &
                                                " para llegar a 100%. Peso actual del hito: " & Text(valor19, "[$-es-ES]0%"),
                                                NotificationType.Warning,2000
                                            ),
                                            Notify(
                                                "¡Perfecto! El total de pesos es 100%. Peso actual del hito: " & Text(valor19, "[$-es-ES]0%"),
                                                NotificationType.Success,2000
                                            )
                                        )
                                    )
                                )
                              PaddingLeft: =Espacio.XS
                              PressedBorderColor: =RGBA(0, 120, 212, 1)
                              PressedColor: =RGBA(50, 49, 48, 1)
                              PressedFill: =RGBA(255, 255, 255, 1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =(Fuente.Normal) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                              Tooltip: =Parent.DisplayName
                              Width: =Parent.Width - 60
                              X: =30
                              Y: =lblPesoHitoTitulo.Y + lblPesoHitoTitulo.Height + 5
                        - lblPesoHitoError:
                            Control: Label@2.5.1
                            MetadataKey: ErrorMessage
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =Colores.Error
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(168, 0, 0, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =10
                              Live: =Live.Assertive
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: |+
                                =
                                "La suma de los pesos es mayor a 100"
                              Visible: =If(varTotalPeso > 100, true,false)
                              Width: =Parent.Width - 60
                              X: =30
                              Y: =txtPesoHito.Y + txtPesoHito.Height
                        - lblPesoHitoObligatorio:
