                Children:
                  - btnCancelarFormHito:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =MyTheme.Gray
                        Color: =MyTheme.Gray
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =Color.Transparent
                        FocusedBorderThickness: =2
                        Font: =Font.Lato
                        Height: =35
                        HoverBorderColor: =ColorFade(Self.BorderColor, -20%)
                        HoverColor: =ColorFade(Self.Color, -20%)
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: =ResetForm(frmHito); Set(varHito,Blank()); Back();
                        PressedBorderColor: =Self.Color
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =ColorFade(Self.Fill, -20%)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =(Fuente.Pequena) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                        Text: ="Cancelar"
                        Width: =100
                  - btnGuardarHito:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        BorderStyle: =BorderStyle.None
                        Color: =Colores.Blanco
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        DisplayMode: |-
                          =If(
                              // 1) Form inválido por reglas del formulario
                              !frmHito.Valid
                              // 2) Validación de rango personalizada (txtAvanceHito)
                              || With(
                                  { v: txtAvanceHito.Text },
                                  !IsBlank(v) && ( !IsNumeric(v) || Value(v) < 0 || Value(v) > 100 )
                              )
                              // 3) NUEVO: Error por suma de pesos > 100 (variable global que ya seteamos)
                              || varErrorPeso,
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =MyTheme.Primary
                        Font: =Font.Lato
                        Height: =35
                        HoverBorderColor: =Self.Color
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =// Fechas: fin >= inicio siempre; fin >= hoy cuando el hito es nuevo o se cambia su fecha fin
                          With(
                              { _ini: dtpFechaInicioHito.SelectedDate, _fin: dtpFechaFinHito.SelectedDate },
                              If(
                                  !IsBlank(_ini) && !IsBlank(_fin) && _fin < _ini,
                                  Notify("La fecha de fin no puede ser menor que la fecha de inicio", NotificationType.Error),
                                  !IsBlank(_fin) && _fin < Today() && (frmHito.Mode = FormMode.New || _fin <> varHito.Fecha_Fin),
                                  Notify("La fecha de fin no puede ser anterior a hoy", NotificationType.Error),
                                  SubmitForm(frmHito)
                              )
                          )
                        PressedBorderColor: =Self.Color
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =ColorFade(Self.Fill, -20%)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =(Fuente.Pequena) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                        Text: ="Guardar"
                        Width: =100
