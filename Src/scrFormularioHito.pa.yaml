Screens:
  scrFormularioHito:
    Properties:
      Fill: =Colores.Blanco
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(VarOpcionesEstadoHitos, Filter(EstadosHito, Value in ["Pendiente","En progreso","Completado","Cancelado"]));
        Set(varSkipRecalc, false);
        // Suma de pesos del proyecto del hito (sin notificar al abrir; el aviso sale al cambiar el peso).
        // ColHitos contiene todos los hitos del proyecto para cualquier rol.
        With(
            { proyectoId: Coalesce(varHito.'ID proyecto', varProyecto.ID) },
            Set(
                varTotalPeso,
                Round(Sum(Filter(ColHitos, 'ID proyecto' = proyectoId), Coalesce(Peso, 0)), 2)
            )
        );
        Set(varErrorPeso, varTotalPeso > 100)
