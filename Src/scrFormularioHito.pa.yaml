            - frmHito:
                Control: Form@2.4.4
                Variant: Classic
                Layout: Vertical
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =Colores.FondoSuave
                  DataSource: =Hitos
                  Item: =varHito
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  NumberOfColumns: =2
                  OnFailure: |-
                    =Notify(
                        If(IsBlank(Self.Error), "Error guardando el hito", Self.Error),
                        NotificationType.Error
                    )
                  OnSuccess: |-
                    =// Progreso y SPI del proyecto con TODOS sus hitos. El proyecto sale del registro guardado (no de varProyecto).
                    With(
                        { _idP: Self.LastSubmit.'ID proyecto' },
                        // RECALC-PROGRESO: Progreso y SPI del proyecto _idP con TODOS sus hitos (copia idéntica en scrFormularioHito, cmpPopupEliminar, scrInicio y scrMisHitos)
                    With(
                        {
                            _p: LookUp(Proyectos, ID = _idP),
                            _h: Filter(Hitos, 'ID proyecto' = _idP)
                        },
                        With(
                            {
                                _t: Sum(_h, Coalesce(Peso, 0)),
                                _c: Sum(_h, Coalesce(Peso, 0) * Coalesce(Avance, 0) / 100),
                                _ini: _p.'Fecha creación caso aprovisionamiento ',
                                _fin: _p.Fecha_Fin
                            },
                            With(
                                {
                                    _real: If(_t = 0, 0, Round(_c / _t, 2)),
                                    _plan: If(
                                        IsBlank(_ini) || IsBlank(_fin), Blank(),
                                        Today() <= _ini, 0,
                                        Today() >= _fin, 1,
                                        DateDiff(_ini, Today(), TimeUnit.Days) / Max(1, DateDiff(_ini, _fin, TimeUnit.Days))
                                    )
                                },
                                With(
                                    {
                                        _cambios: {
                                            Progreso: _real * 100,
                                            SPI: If(IsBlank(_plan), Blank(), _plan = 0, If(_real = 0, 1, 0), _real / _plan)
                                        }
                                    },
                                    If(
                                        !IsBlank(_p),
                                        If(
                                            IsError(Patch(Proyectos, _p, _cambios)),
                                            Notify("No se pudo actualizar Progreso/SPI del proyecto.", NotificationType.Error),
                                            If(
                                                !IsBlank(LookUp(ColProyectos, ID = _idP)),
                                                Patch(ColProyectos, LookUp(ColProyectos, ID = _idP), _cambios)
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                    );
                    // Colección local: alta o actualización del hito guardado
                    If(
                        IsBlank(LookUp(ColHitos, ID = Self.LastSubmit.ID)),
                        Collect(ColHitos, Self.LastSubmit),
                        Patch(ColHitos, LookUp(ColHitos, ID = Self.LastSubmit.ID), Self.LastSubmit)
                    );
                    Set(varHito, Blank());
                    Back();
                    Notify("Hito guardado", NotificationType.Success)
                  Width: =Min(800,Parent.Width)
