                                                                  X: =Parent.Width * 4 / Max(1, If(varVista1 = "Semana", CountRows(coleccion_semanas), CountRows(coleccion_meses)))
      - btnRecalcularCronogramaProyectos:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(0, 0, 0, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            Fill: '=Color.Transparent  '
            Font: =Font.Lato
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =ColorFade(Self.Color,15%)
            HoverFill: =ColorFade(RGBA(0,0,0,0.00001),15%)
            OnSelect: |-
              =// Única copia de la construcción del cronograma en esta pantalla (OnVisible, flechas y Hoy la ejecutan con Select).
              // Misma base que btnRecalcularCronogramaHitos en scrCronogramaHitos: si se cambia aquí, cambiarla allí.
              /* ---------------- SEMANAS: 5 semanas desde el lunes de (hoy + varSemanaOffset semanas) ---------------- */
              Set(varHoy, DateAdd(Today(), Coalesce(varSemanaOffset, 0) * 7, TimeUnit.Days));
              Set(_inicioSemana, DateAdd(varHoy, -Weekday(varHoy, StartOfWeek.MondayZero), TimeUnit.Days));
              ClearCollect(
                  coleccion_semanas,
                  ForAll(
                      Sequence(5),
                      With(
                          {
                              _ini: DateAdd(_inicioSemana, (Value - 1) * 7, TimeUnit.Days),
                              _fin: DateAdd(_inicioSemana, (Value - 1) * 7 + 6, TimeUnit.Days)
                          },
                          {
                              Inicio: _ini,
                              Fin: _fin,
                              RangoTexto: If(
                                  Month(_ini) = Month(_fin),
                                  Text(_ini, "[$-es-ES]mmm") & " " & Text(_ini, "[$-es-ES]d") & "-" & Text(_fin, "[$-es-ES]d"),
                                  Text(_ini, "[$-es-ES]mmm d") & "-" & Text(_fin, "[$-es-ES]mmm d")
                              ),
                              MesTexto: Text(_ini, "[$-es-ES]mmmm yyyy")
                          }
                      )
                  )
              );
              // Mes de la cabecera en vista Semana: el que ocupa más semanas de la ventana
              With(
                  {
                      _m1: Date(Year(First(coleccion_semanas).Inicio), Month(First(coleccion_semanas).Inicio), 1),
                      _m2: Date(Year(Last(coleccion_semanas).Inicio), Month(Last(coleccion_semanas).Inicio), 1)
                  },
                  With(
                      {
                          _c1: CountRows(Filter(coleccion_semanas, Year(Inicio) = Year(_m1) && Month(Inicio) = Month(_m1))),
                          _c2: CountRows(Filter(coleccion_semanas, Year(Inicio) = Year(_m2) && Month(Inicio) = Month(_m2)))
                      },
                      Set(
                          VarDiaActual,
                          If(
                              _c1 > 2 && _c1 >= _c2, _m1,
                              _c2 > 2, _m2,
                              With(
                                  { _wkCentral: Last(FirstN(coleccion_semanas, 3)) },
                                  Date(Year(_wkCentral.Inicio), Month(_wkCentral.Inicio), 1)
                              )
                          )
                      )
                  )
              );
              /* ---------------- MESES: 5 meses desde (mes actual + varMesOffset meses) ---------------- */
              Set(VarMesActual, DateAdd(Date(Year(Today()), Month(Today()), 1), Coalesce(varMesOffset, 0), TimeUnit.Months));
              ClearCollect(
                  coleccion_meses,
                  ForAll(
                      Sequence(5),
                      With(
                          { _iniM: DateAdd(VarMesActual, Value - 1, TimeUnit.Months) },
                          {
                              InicioMes: _iniM,
                              FinMes: DateAdd(DateAdd(_iniM, 1, TimeUnit.Months), -1, TimeUnit.Days),
                              MesTexto: Text(_iniM, "[$-es-ES]mmmm yyyy")
                          }
                      )
                  )
              );/* ---------------- PROYECTOS EN LAS VENTANAS ---------------- */
              With(
                  {
                      VentanaIni: First(coleccion_semanas).Inicio,
                      VentanaFin: Last(coleccion_semanas).Fin
                  },
                  // Mismo esquema que Coll_subCollectionMes: galBarraProyectoGantt elige entre las dos con If, y si los registros
                  // tienen columnas distintas la rama de Semana queda vacía (las barras no se veían en vista Semana).
                  // La posición y el ancho de cada barra los calcula btnBarraProyectoGantt con las fechas, no hacen falta columnas extra.
                  ClearCollect(
                      Coll_SubCollection_Semanas,
                      Filter(
                          ColProyectos,
                          'Fecha creación caso aprovisionamiento ' <= VentanaFin && Fecha_Fin >= VentanaIni
                      )
                  )
              );
              With(
                  {
                      ventanaIni: First(coleccion_meses).InicioMes,
                      ventanaFin: Last(coleccion_meses).FinMes
                  },
                  ClearCollect(
                      Coll_subCollectionMes,
                      Filter(
                          ColProyectos,
                          'Fecha creación caso aprovisionamiento ' <= ventanaFin && Fecha_Fin >= ventanaIni
                      )
                  )
              )
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =ColorFade(Self.HoverFill, -30%)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: ="Recalcular cronograma"
            Visible: =false
            Width: =180
