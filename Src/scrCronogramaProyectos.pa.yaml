                                                                                  },
                                                                                  With(
                                                                                      {
                                                                                          iniClip: Max(ThisItem.'Fecha creación caso aprovisionamiento ', ventIni),
                                                                                          finClip: Min(ThisItem.Fecha_Fin, ventFin)
                                                                                      },
                                                                                      If(
                                                                                          iniClip > finClip,
                                                                                          0,
                                                                                          semWidth *
                                                                                          Max(
                                                                                              1,
                                                                                              DateDiff(
                                                                                                  DateAdd(iniClip, -Weekday(iniClip, StartOfWeek.MondayZero), TimeUnit.Days),
                                                                                                  DateAdd(finClip, -Weekday(finClip, StartOfWeek.MondayZero), TimeUnit.Days),
                                                                                                  TimeUnit.Days
                                                                                              ) / 7 + 1
                                                                                          )
                                                                                      )
                                                                                  )
                                                                              ),

