                                    Wrap: =false
                                    Y: =lblFechaFinProyectoTitulo.Y
                              - dtpFechaFinProyecto:
                                  Control: DatePicker@0.0.46
                                  Properties:
                                    Font: =Font.Lato
                                    FontSize: =(13) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                                    Format: ='DatePickerCanvas.Format'.Short
                                    Height: =40
                                    OnChange: |-
                                      =// Regla: la fecha fin no puede ser anterior a la fecha de inicio (creación del caso) ni a hoy
                                      If(
                                          !IsBlank(Self.SelectedDate) && !IsBlank(dtpFechaCreacionCaso.SelectedDate) && Self.SelectedDate < dtpFechaCreacionCaso.SelectedDate,
                                          Notify("La fecha de fin no puede ser menor que la fecha de inicio", NotificationType.Error);
                                          Reset(Self),
                                          !IsBlank(Self.SelectedDate) && Self.SelectedDate < Today(),
                                          Notify("La fecha de fin no puede ser anterior a hoy", NotificationType.Error);
                                          Reset(Self)
                                      )
                                    PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
                                    PaddingRight: =Espacio.XS
                                    Placeholder: ="Seleccciona una fecha"
                                    SelectedDate: |-
                                      =// En edición se respeta la fecha guardada (puede venir de una solicitud de cambio aprobada)
                                      If(
                                          frmProyecto.Mode = FormMode.Edit,
                                          Parent.Default,
                                          With(
                                              {
                                                  _creacion: dtpFechaCreacionCaso.SelectedDate,
                                                  _dias: Value(txtTiempoImplementacion.Text)
                                              },
                                              If(
                                                  IsBlank(_creacion) || IsBlank(_dias),
                                                  Blank(),
                                                  DateAdd(_creacion, _dias, TimeUnit.Days)
                                              )
                                          )
                                      )
                                    Width: =Parent.Width - 60
                                    X: =30
                                    Y: =lblFechaFinProyectoTitulo.Y + lblFechaFinProyectoTitulo.Height + 5
