Screens:
  scrFormularioProyecto:
    Properties:
      Fill: =Colores.Blanco
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =If(IsBlank(cmbEstadoProyecto.Selected.Value), Set(VarOpcionesEstado, Filter(EstadosProyecto, Value in ["En progreso"])),Set(VarOpcionesEstado, Filter(EstadosProyecto, Value in ["En progreso","Completado","Stand By", "Cancelado"])));
        Set(loading, false);
        Set(respuesta,Blank());
        // Comentarios: se leen solo los del proyecto abierto (consulta delegable; evita el límite de 2000 filas)
        If(
            IsBlank(varProyecto),
            Clear(ColComentarios),
            ClearCollect(ColComentarios, Filter(ComentariosProyectos, 'ID proyecto' = varProyecto.ID))
        )
    Children:
      - cntPantallaFormProyecto:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(App.ActiveScreen.Size >= ScreenSize.Large, LayoutDirection.Horizontal, LayoutDirection.Vertical)
            LayoutGap: =Espacio.M
            LayoutOverflowY: =If(App.ActiveScreen.Size >= ScreenSize.Large, LayoutOverflow.Hide, LayoutOverflow.Scroll)
            Width: =Parent.Width
          Children:
            - cntContenidoFormProyecto:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutMinWidth: =0
                  LayoutMinHeight: =If(App.ActiveScreen.Size >= ScreenSize.Large, 0, App.Height + 350)
                  FillPortions: =1
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cntEncabezadoFormProyecto:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutWrap: =App.ActiveScreen.Size = ScreenSize.Small
                        LayoutOverflowX: =LayoutOverflow.Scroll
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(App.ActiveScreen.Size = ScreenSize.Small, 125, 70)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =Espacio.M
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Min(800,Parent.Width)
                      Children:
                        - icoCerrarFormProyecto:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =MyTheme.Primary
                              DisabledBorderColor: =RGBA(245, 245, 245, 1)
                              DisabledColor: =RGBA(225, 223, 221, 1)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =30
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(16, 110, 190, 1)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Icon: =Icon.Cancel
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: =ResetForm(frmProyecto); Set(varProyecto,Blank()); Back();
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(16, 110, 190, 1)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =30
                        - lblTituloFormProyecto:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =If(App.ActiveScreen.Size = ScreenSize.Small, AlignInContainer.Start, AlignInContainer.SetByContainer)
                              Align: =If(App.ActiveScreen.Size = ScreenSize.Small, Align.Left, Align.Center)
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =MyTheme.Primary
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FillPortions: =If(App.ActiveScreen.Size = ScreenSize.Small, 0, 1.3)
                              FocusedBorderThickness: =4
                              Font: =Font.'Lato Black'
                              Height: =If(App.ActiveScreen.Size = ScreenSize.Small, 50, 70)
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =If(frmProyecto.Mode = FormMode.Edit && !(App.ActiveScreen.Size = ScreenSize.Small), 200, 0)
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =(Fuente.Titulo) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                              Text: =If(IsBlank(varProyecto),"Proyecto",varProyecto.'Nombre del proyecto')
                              Tooltip: =varProyecto.'Nombre del proyecto'
                              Width: =If(App.ActiveScreen.Size = ScreenSize.Small, Parent.Width - Parent.PaddingLeft - icoCerrarFormProyecto.Width - 10, 200)
                              Wrap: =false
                        - cntIndicadoresProyecto:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =If(App.ActiveScreen.Size = ScreenSize.Small, AlignInContainer.Start, AlignInContainer.SetByContainer)
                              Height: =If(App.ActiveScreen.Size = ScreenSize.Small, 65, Parent.Height)
                              Width: =If(App.ActiveScreen.Size = ScreenSize.Small, Parent.Width - Parent.PaddingLeft - 10, 220)
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              DropShadow: =DropShadow.None
                              FillPortions: =If(App.ActiveScreen.Size = ScreenSize.Small, 0, 0.7)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =Espacio.M
                              LayoutJustifyContent: =If(App.ActiveScreen.Size = ScreenSize.Small, LayoutJustifyContent.End, LayoutJustifyContent.Center)
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =frmProyecto.Mode=FormMode.Edit
                            Children:
                              - cntAvanceRealProyecto:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =Max(55, Parent.Height * 0.85)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =80
                                  Children:
                                    - lblAvanceRealTitulo:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          Color: =Colores.Texto
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FillPortions: =1
                                          Font: =Font.Lato
                                          Height: =Parent.Height*0.3
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinHeight: =0
                                          Size: =(Fuente.Pequena) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                                          Text: ="Avance"
                                          VerticalAlign: =VerticalAlign.Bottom
                                          Width: =Parent.Width
                                    - btnAvanceRealValor:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          Color: =Colores.Blanco
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          DisplayMode: =DisplayMode.View
                                          Fill: =MyTheme.Primary
                                          Font: =Font.Lato
                                          Height: =30
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =RGBA(16, 110, 190, 1)
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PressedBorderColor: =RGBA(0, 69, 120, 1)
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(16, 110, 190, 1)
                                          RadiusBottomLeft: =20
                                          RadiusBottomRight: =20
                                          RadiusTopLeft: =20
                                          RadiusTopRight: =20
                                          Size: =(Fuente.Normal) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                                          Text: |-
                                            =// Avance real (0..100) con todos los hitos del proyecto
                                            With(
                                                { hitosProyecto: Filter(ColHitos, 'ID proyecto' = varProyecto.ID) },
                                                With(
                                                    {
                                                        totalPeso: Sum(hitosProyecto, Coalesce(Peso, 0)),
                                                        completedPeso: Sum(hitosProyecto, Coalesce(Peso, 0) * Coalesce(Avance, 0) / 100)
                                                    },
                                                    Text(
                                                        IfError(If(totalPeso = 0, 0, Round(completedPeso / totalPeso * 100, 2)), 0),
                                                        "[$-es-ES]0%"
                                                    )
                                                )
                                            )
                                          Visible: =frmProyecto.Mode=FormMode.Edit
                                          Width: =60
                                          Y: =15
                              - cntSpiProyecto:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =Max(55, Parent.Height * 0.85)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =80
                                  Children:
                                    - lblSpiTitulo:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          Color: =Colores.Texto
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FillPortions: =1
                                          Font: =Font.Lato
                                          Height: =Parent.Height*0.3
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          LayoutMinHeight: =0
                                          Size: =(Fuente.Pequena) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                                          Text: ="SPI"
                                          VerticalAlign: =VerticalAlign.Bottom
                                          Width: =Parent.Width
                                    - btnSpiValor:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          Color: =Colores.Blanco
                                          DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          DisabledFill: =RGBA(242, 242, 241, 0)
                                          DisplayMode: =DisplayMode.View
                                          Fill: |-
                                            =If(
                                                StartsWith( Lower(Language()), "es" ),
                                                /* --- Rama español --- */
                                                With(
                                                    {
                                                        pct: IfError(
                                                                Value(
                                                                    Substitute(
                                                                        Substitute( Trim(btnSpiValor.Text), "%", "" ),
                                                                        ",", "."
                                                                    )
                                                                ),
                                                                Blank()
                                                            )
                                                    },
                                                    If(
                                                        IsBlank(btnSpiValor.Text) || IsBlank(pct) || pct = 0,
                                                        MyTheme.Gray,
                                                        If(
                                                            pct <= 80,
                                                            ColorValue("#dc2626"),
                                                            If(
                                                                pct <= 95,
                                                                ColorValue("#f59e0b"),
                                                                ColorValue("#16a34a")
                                                            )
                                                        )
                                                    )
                                                ),
                                                /* --- Rama otros idiomas --- */
                                                With(
                                                    {
                                                        pct: IfError(
                                                                Value(
                                                                    Substitute(
                                                                        Substitute( Trim(btnSpiValor.Text), "%", "" ),
                                                                        ".", ","
                                                                    )
                                                                ),
                                                                Blank()
                                                            )
                                                    },
                                                    If(
                                                        IsBlank(btnSpiValor.Text) || IsBlank(pct) || pct = 0,
                                                        MyTheme.Gray,
                                                        If(
                                                            pct <= 80,
                                                            ColorValue("#dc2626"),
                                                            If(
                                                                pct <= 95,
                                                                ColorValue("#f59e0b"),
                                                                ColorValue("#16a34a")
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                          Font: =Font.Lato
                                          Height: =30
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =RGBA(255, 255, 255, 1)
                                          HoverFill: =RGBA(16, 110, 190, 1)
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PressedBorderColor: =RGBA(0, 69, 120, 1)
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(16, 110, 190, 1)
                                          RadiusBottomLeft: =20
                                          RadiusBottomRight: =20
                                          RadiusTopLeft: =20
                                          RadiusTopRight: =20
                                          Size: =(Fuente.Normal) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                                          Text: |-
                                            =// SPI = avance real / avance planificado (0,00 si no se puede calcular). Se calcula una sola vez.
                                            With(
                                                {
                                                    hitosProyecto: Filter(ColHitos, 'ID proyecto' = varProyecto.ID),
                                                    inicio: varProyecto.'Fecha creación caso aprovisionamiento ',
                                                    fin: varProyecto.Fecha_Fin,
                                                    hoy: Today()
                                                },
                                                With(
                                                    {
                                                        totalPeso: Sum(hitosProyecto, Coalesce(Peso, 0)),
                                                        completedPeso: Sum(hitosProyecto, Coalesce(Peso, 0) * Coalesce(Avance, 0) / 100)
                                                    },
                                                    With(
                                                        {
                                                            // Avance real (0..1)
                                                            real: IfError(If(totalPeso = 0, 0, Round(completedPeso / totalPeso, 2)), Blank()),
                                                            // Avance planificado (0..1) por días
                                                            plan: If(
                                                                IsBlank(inicio) || IsBlank(fin), Blank(),
                                                                hoy <= inicio, 0,
                                                                hoy >= fin, 1,
                                                                DateDiff(inicio, hoy, TimeUnit.Days) / Max(1, DateDiff(inicio, fin, TimeUnit.Days))
                                                            )
                                                        },
                                                        Text(
                                                            Coalesce(If(IsBlank(plan), Blank(), plan = 0, If(real = 0, 1, 0), real / plan), 0),
                                                            "[$-es-ES]0,00"
                                                        )
                                                    )
                                                )
                                            )
                                          Visible: =frmProyecto.Mode=FormMode.Edit
                                          Width: =60
                                          Y: =15
                              - cntEliminarProyecto:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =Parent.Height*0.7
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =30
                                  Children:
                                    - icoEliminarProyecto:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          Color: =Color.Red
                                          DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                          DisabledColor: =RGBA(225, 223, 221, 1)
                                          DisabledFill: =RGBA(0, 0, 0, 0)
                                          FocusedBorderThickness: =4
                                          Height: =30
                                          HoverBorderColor: =RGBA(0, 0, 0, 0)
                                          HoverColor: =MyTheme.Gray
                                          HoverFill: =RGBA(0, 0, 0, 0)
                                          Icon: =Icon.Trash
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          OnSelect: =Set(varEliminar,true);
                                          PressedBorderColor: =RGBA(0, 0, 0, 0)
                                          PressedColor: =ColorFade(Self.HoverColor, -20%)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          Visible: =!IsBlank(varProyecto)
                                          Width: =30
                  - frmProyecto:
                      Control: Form@2.4.4
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =Colores.FondoSuave
                        DataSource: =Proyectos
                        Item: =varProyecto
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =400
                        NumberOfColumns: =2
                        OnFailure: |-
                          =Notify(
                              If(IsBlank(Self.Error), "Error enviando el formulario", Self.Error),
                              NotificationType.Error
                          )
                        OnSuccess: |-
                          =// Hitos automáticos: solo al CREAR el proyecto, tras un guardado correcto y si la consulta a CRM trajo hitos
                          If(
                              locEraNuevo && !IsBlank(respuesta.hito),
                              IfError(
                                  /* MODO DEMO: creación simulada del hito inicial */ Collect(Hitos, { ID: Max(Hitos, ID) + 1, Title: respuesta.hito, 'Nombre del hito': respuesta.hito, 'ID proyecto': Self.LastSubmit.ID, Descripción: "Hito creado automáticamente (demo)", Fecha_Inicio: Today(), Fecha_Fin: DateAdd(Today(), 30), Estado: { Value: "Pendiente" }, Peso: 100, Avance: 0, Encargado: First(UsuariosDemo), Created: Now() }),
                                  Notify("Proyecto guardado, pero no se pudieron crear los hitos automáticos.", NotificationType.Warning)
                              );
                              RemoveIf(ColHitos, 'ID proyecto' = Self.LastSubmit.ID);
                              Collect(ColHitos, Filter(Hitos, 'ID proyecto' = Self.LastSubmit.ID))
                          );
                          // Colección local de proyectos: alta o actualización (sin recargar todas las listas)
                          If(
                              IsBlank(LookUp(ColProyectos, ID = Self.LastSubmit.ID)),
                              Collect(ColProyectos, Self.LastSubmit),
                              Patch(ColProyectos, LookUp(ColProyectos, ID = Self.LastSubmit.ID), Self.LastSubmit)
                          );
                          UpdateContext({ locEraNuevo: false });
                          Notify("Proyecto guardado", NotificationType.Success);
                          ResetForm(frmProyecto);
                          Set(varProyecto, Blank());
                          Back();
                        Width: =Min(800,Parent.Width)
                      Children:
                        - crdNumeroCaso:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicNumberEdit
                            Properties:
                              BorderColor: =Colores.FondoSuave
                              DataField: ="NumeroCaso"
                              Default: =ThisItem.NumeroCaso
                              DisplayMode: '=If(frmProyecto.Mode=FormMode.Edit,DisplayMode.View,DisplayMode.Edit) '
                              DisplayName: ="Número de caso"
                              Required: =false
                              Update: =Value(txtNumeroCaso.Text)
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                            Children:
                              - lblNumeroCasoTitulo:
                                  Control: Label@2.5.1
                                  MetadataKey: FieldName
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =Colores.Texto
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.Lato
                                    FontWeight: =FontWeight.Semibold
                                    Height: =34
                                    PaddingLeft: =0
                                    Text: ="Número de caso"
                                    Width: =Parent.Width - 60
                                    Wrap: =false
                                    X: =30
                                    Y: =10
                              - txtNumeroCaso:
                                  Control: Classic/TextInput@2.3.2
                                  MetadataKey: FieldValue
                                  Properties:
                                    BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                                    Color: =Colores.Texto
                                    Default: =Parent.Default
                                    DelayOutput: =true
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    DisplayMode: =If(respuesta.respuesta<>"false",DisplayMode.Edit,DisplayMode.View)
                                    Fill: =Colores.VeloSuave
                                    Font: =Font.Lato
                                    Format: =TextFormat.Number
                                    HintText: ="Ingrese el número de caso que corresponde"
                                    HoverBorderColor: =RGBA(16, 110, 190, 1)
                                    HoverColor: =RGBA(50, 49, 48, 1)
                                    HoverFill: =RGBA(255, 255, 255, 1)
                                    OnChange: =Set(n_numero_caso,txtNumeroCaso.Text)
                                    PaddingLeft: =Espacio.XS
                                    PressedBorderColor: =RGBA(0, 120, 212, 1)
                                    PressedColor: =RGBA(50, 49, 48, 1)
                                    PressedFill: =RGBA(255, 255, 255, 1)
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =(Fuente.Normal) * If(App.ActiveScreen.Size = ScreenSize.Small, 0.85, App.ActiveScreen.Size = ScreenSize.Medium, 0.92, 1)
                                    Tooltip: =Parent.DisplayName
                                    Width: =Parent.Width/2
                                    X: =30
                                    Y: =lblNumeroCasoTitulo.Y + lblNumeroCasoTitulo.Height + 5
                              - lblNumeroCasoError:
                                  Control: Label@2.5.1
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =Colores.Error
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(168, 0, 0, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =10
                                    Live: =Live.Assertive
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Text: =Parent.Error
                                    Visible: =Parent.DisplayMode=DisplayMode.Edit
                                    Width: =Parent.Width - 60
                                    X: =30
