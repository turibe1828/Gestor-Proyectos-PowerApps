                                    ChevronHoverFill: =RGBA(50, 49, 48, 1)
                                    Color: =Colores.Texto
                                    Default: =Parent.Default
                                    DefaultSelectedItems: |-
                                      =// Si el avance (con todos los hitos del proyecto) llega al 100 %, se propone Completado
                                      With(
                                          { _h: Filter(ColHitos, 'ID proyecto' = varProyecto.ID) },
                                          With(
                                              {
                                                  _t: Sum(_h, Coalesce(Peso, 0)),
                                                  _c: Sum(_h, Coalesce(Peso, 0) * Coalesce(Avance, 0) / 100)
                                              },
                                              If(
                                                  !IsBlank(varProyecto) && _t > 0 && Round(_c / _t * 100, 2) >= 100,
                                                  LookUp(EstadosProyecto, Value = "Completado"),
                                                  ThisItem.Estado
                                              )
                                          )
